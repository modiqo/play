schema: play.conformance-paths/v1

cases:
  - name: non-outcome conversation exits the hook
    steps:
      - {state: qualify, event: conversation, target: exited}
    terminal: exited

  - name: explicit Play search can keep merged results without running
    steps:
      - {state: qualify, event: play_search_request, target: search}
      - state: search
        event: search_ready
        guards: {search_only_requested: true, search_is_complete: true}
        target: search_present
      - {state: search_present, event: search_presented, target: search_offer}
      - {state: search_offer, event: search_dismissed, target: completed}
    terminal: completed
    excludes: [classify, use_inspect, use_run, explore_offer]

  - name: explicit Play search inspects an organization result before approval
    steps:
      - {state: qualify, event: play_search_request, target: search}
      - state: search
        event: search_ready
        guards: {search_only_requested: true, search_is_complete: true}
        target: search_present
      - {state: search_present, event: search_presented, target: search_offer}
      - {state: search_offer, event: search_play_selected, target: use_inspect}
      - {state: use_inspect, event: play_inspected, target: use_offer}
      - {state: use_offer, event: play_run_declined, target: completed}
    terminal: completed
    excludes: [classify, use_run, explore_offer]

  - name: exact Play reference is inspected and approved before first-class execution
    steps:
      - {state: qualify, event: exact_play_request, target: use_inspect}
      - {state: use_inspect, event: play_inspected, target: use_offer}
      - {state: use_offer, event: play_run_approved, target: use_run}
      - {state: use_run, event: play_run_ready, target: use_output}
      - {state: use_output, event: detailed_output_ready, target: use_verify}
      - {state: use_verify, event: outcome_verified, target: use_receipt}
      - {state: use_receipt, event: receipt_ready, target: receipt}
    terminal: receipt
    excludes: [search, classify, author_release, birth_capture, private_publish, public_publish, birth_bind, index]

  - name: unresolved exact reference falls back to outcome search
    steps:
      - {state: qualify, event: exact_play_request, target: use_inspect}
      - {state: use_inspect, event: play_reference_unresolved, target: search}
      - {state: search, event: search_ready, guards: {search_is_complete: true}, target: classify}
      - {state: classify, event: no_match, target: explore_offer}
      - {state: explore_offer, event: ordinary_execution_selected, target: exited}
    terminal: exited
    excludes: [use_run]

  - name: discovered adequate Play also runs through the first-class controller
    steps:
      - {state: qualify, event: outcome_request, target: search}
      - {state: search, event: search_ready, guards: {search_is_complete: true}, target: classify}
      - state: classify
        event: full_match
        guards: {match_satisfies_constraints: true}
        target: use_inspect
      - {state: use_inspect, event: play_inspected, target: use_offer}
      - {state: use_offer, event: play_run_approved, target: use_run}
      - {state: use_run, event: play_run_ready, target: use_output}
      - {state: use_output, event: detailed_output_ready, target: use_verify}
      - {state: use_verify, event: outcome_verified, target: use_receipt}
      - {state: use_receipt, event: receipt_ready, target: receipt}
    terminal: receipt

  - name: inadequate full match falls back to Explore offer
    steps:
      - {state: qualify, event: outcome_request, target: search}
      - {state: search, event: search_ready, guards: {search_is_complete: true}, target: classify}
      - state: classify
        event: full_match
        guards: {match_satisfies_constraints: false}
        target: explore_offer
      - {state: explore_offer, event: ordinary_execution_selected, target: exited}
    terminal: exited

  - name: no match can step aside
    steps:
      - {state: qualify, event: outcome_request, target: search}
      - {state: search, event: search_ready, guards: {search_is_complete: true}, target: classify}
      - {state: classify, event: no_match, target: explore_offer}
      - {state: explore_offer, event: ordinary_execution_selected, target: exited}
    terminal: exited

  - name: verified exploration can skip saving
    steps:
      - {state: qualify, event: outcome_request, target: search}
      - {state: search, event: search_ready, guards: {search_is_complete: true}, target: classify}
      - {state: classify, event: no_match, target: explore_offer}
      - {state: explore_offer, event: explore_approved, target: explore_prepare}
      - state: explore_prepare
        event: exploration_ready
        guards: {explore_is_approved: true}
        target: explore_route
      - state: explore_route
        event: route_selected
        guards: {route_within_policy: true}
        target: explore_dispatch
      - {state: explore_dispatch, event: direct_handoff_ready, target: explore_handoff}
      - {state: explore_handoff, event: specialist_handoff_ready, target: explore_execute}
      - {state: explore_execute, event: outcome_ready, target: explore_receipt}
      - {state: explore_receipt, event: specialist_outcome_ready, target: explore_verify}
      - {state: explore_verify, event: outcome_verified, target: crystallize}
      - state: crystallize
        event: candidate_ready
        guards: {outcome_is_verified: true}
        target: save_offer
      - {state: save_offer, event: save_skipped, target: completed}
    terminal: completed
    excludes: [author_release, birth_capture, private_org, private_publish, public_owner, public_publish, birth_bind, index]

  - name: a Rote write guard can be approved and resumed without reclassification
    steps:
      - {state: qualify, event: outcome_request, target: search}
      - {state: search, event: search_ready, guards: {search_is_complete: true}, target: classify}
      - {state: classify, event: no_match, target: explore_offer}
      - {state: explore_offer, event: explore_approved, target: explore_prepare}
      - state: explore_prepare
        event: exploration_ready
        guards: {explore_is_approved: true}
        target: explore_route
      - state: explore_route
        event: route_selected
        guards: {route_within_policy: true}
        target: explore_dispatch
      - {state: explore_dispatch, event: direct_handoff_ready, target: explore_handoff}
      - {state: explore_handoff, event: specialist_handoff_ready, target: explore_execute}
      - {state: explore_execute, event: confirmation_required, target: explore_receipt}
      - {state: explore_receipt, event: specialist_confirmation_required, target: effect_offer}
      - {state: effect_offer, event: effect_confirmation_approved, target: explore_handoff}
      - {state: explore_handoff, event: specialist_handoff_ready, target: explore_execute}
      - {state: explore_execute, event: outcome_ready, target: explore_receipt}
      - {state: explore_receipt, event: specialist_outcome_ready, target: explore_verify}
      - {state: explore_verify, event: outcome_verified, target: crystallize}
      - {state: crystallize, event: not_reusable, target: completed}
    terminal: completed
    includes_once: [effect_offer]

  - name: recoverable CALL authentication can be repaired and retried
    steps:
      - {state: explore_execute, event: auth_repair_required, target: explore_receipt}
      - {state: explore_receipt, event: specialist_auth_repair_required, target: auth_repair_offer}
      - {state: auth_repair_offer, event: auth_repair_approved, target: auth_repair_handoff}
      - {state: auth_repair_handoff, event: auth_repair_handoff_ready, target: auth_repair_execute}
      - {state: auth_repair_execute, event: auth_repair_ready, target: auth_repair_receipt}
      - {state: auth_repair_receipt, event: specialist_auth_repair_ready, target: explore_handoff}
      - {state: explore_handoff, event: specialist_handoff_ready, target: explore_execute}
      - {state: explore_execute, event: outcome_ready, target: explore_receipt}
      - {state: explore_receipt, event: specialist_outcome_ready, target: explore_verify}
      - {state: explore_verify, event: outcome_verified, target: crystallize}
      - {state: crystallize, event: not_reusable, target: completed}
    terminal: completed
    includes_once: [auth_repair_offer, auth_repair_handoff, auth_repair_execute, auth_repair_receipt]

  - name: declined authentication repair blocks without retrying the CALL
    steps:
      - {state: explore_execute, event: auth_repair_required, target: explore_receipt}
      - {state: explore_receipt, event: specialist_auth_repair_required, target: auth_repair_offer}
      - {state: auth_repair_offer, event: auth_repair_declined, target: blocked}
    terminal: blocked
    excludes: [auth_repair_handoff, auth_repair_execute, auth_repair_receipt]

  - name: invalid authentication repair receipt blocks before CALL retry
    steps:
      - {state: auth_repair_execute, event: auth_repair_ready, target: auth_repair_receipt}
      - {state: auth_repair_receipt, event: auth_repair_receipt_invalid, target: blocked}
    terminal: blocked
    excludes: [explore_handoff, explore_verify]

  - name: private save publishes to a private org and indexes
    steps: &explore_to_save
      - {state: qualify, event: outcome_request, target: search}
      - {state: search, event: search_ready, guards: {search_is_complete: true}, target: classify}
      - {state: classify, event: no_match, target: explore_offer}
      - {state: explore_offer, event: explore_approved, target: explore_prepare}
      - state: explore_prepare
        event: exploration_ready
        guards: {explore_is_approved: true}
        target: explore_route
      - state: explore_route
        event: route_selected
        guards: {route_within_policy: true}
        target: explore_dispatch
      - {state: explore_dispatch, event: direct_handoff_ready, target: explore_handoff}
      - {state: explore_handoff, event: specialist_handoff_ready, target: explore_execute}
      - {state: explore_execute, event: outcome_ready, target: explore_receipt}
      - {state: explore_receipt, event: specialist_outcome_ready, target: explore_verify}
      - {state: explore_verify, event: outcome_verified, target: crystallize}
      - state: crystallize
        event: candidate_ready
        guards: {outcome_is_verified: true}
        target: save_offer
      - {state: save_offer, event: save_private, target: author_release}
      - state: author_release
        event: flow_released
        target: birth_capture
      - state: birth_capture
        event: birth_captured
        guards: {save_choice_private: true, save_choice_public: false}
        target: private_org
      - state: private_org
        event: private_org_ready
        guards: {private_org_policy_satisfied: true}
        target: private_publish
      - state: private_publish
        event: play_published
        guards: {publication_is_private: true}
        target: birth_bind
      - state: birth_bind
        event: birth_bound
        target: index
      - state: index
        event: play_indexed
        guards: {exact_published_version_is_indexed: true}
        target: saved_inspect
      - state: saved_inspect
        event: saved_play_inspected
        guards: {saved_public_inspection_matches_publication: false, saved_inspection_matches_publication: true}
        target: saved_present
      - {state: saved_present, event: saved_play_presented, target: completed}
    terminal: completed
    includes_once: [author_release, birth_capture, private_org, private_publish, birth_bind, index]

  - name: public save with known owner publishes and indexes
    steps:
      - {state: qualify, event: outcome_request, target: search}
      - {state: search, event: search_ready, guards: {search_is_complete: true}, target: classify}
      - {state: classify, event: no_match, target: explore_offer}
      - {state: explore_offer, event: explore_approved, target: explore_prepare}
      - state: explore_prepare
        event: exploration_ready
        guards: {explore_is_approved: true}
        target: explore_route
      - state: explore_route
        event: route_selected
        guards: {route_within_policy: true}
        target: explore_dispatch
      - {state: explore_dispatch, event: direct_handoff_ready, target: explore_handoff}
      - {state: explore_handoff, event: specialist_handoff_ready, target: explore_execute}
      - {state: explore_execute, event: outcome_ready, target: explore_receipt}
      - {state: explore_receipt, event: specialist_outcome_ready, target: explore_verify}
      - {state: explore_verify, event: outcome_verified, target: crystallize}
      - state: crystallize
        event: candidate_ready
        guards: {outcome_is_verified: true}
        target: save_offer
      - {state: save_offer, event: save_public, target: author_release}
      - state: author_release
        event: flow_released
        target: birth_capture
      - state: birth_capture
        event: birth_captured
        guards: {save_choice_private: false, save_choice_public: true}
        target: public_owner
      - {state: public_owner, event: public_owner_ready, target: public_publish}
      - state: public_publish
        event: play_published
        guards: {publication_is_public: true}
        target: birth_bind
      - state: birth_bind
        event: birth_bound
        target: index
      - state: index
        event: play_indexed
        guards: {exact_published_version_is_indexed: true}
        target: saved_inspect
      - state: saved_inspect
        event: saved_play_inspected
        guards: {saved_public_inspection_matches_publication: true, saved_inspection_matches_publication: true}
        target: publication_credentials
      - {state: publication_credentials, event: associated_credentials_verified, target: publication_smoke}
      - {state: publication_smoke, event: public_smoke_verified, target: saved_present}
      - {state: saved_present, event: saved_play_presented, target: completed}
    terminal: completed
    includes_once: [author_release, birth_capture, public_owner, public_publish, birth_bind, index, publication_credentials, publication_smoke]

  - name: public credential mismatch blocks before smoke and presentation
    steps:
      - state: saved_inspect
        event: saved_play_inspected
        guards: {saved_public_inspection_matches_publication: true, saved_inspection_matches_publication: true}
        target: publication_credentials
      - {state: publication_credentials, event: associated_credentials_invalid, target: blocked}
    terminal: blocked
    excludes: [publication_smoke, saved_present]

  - name: public smoke failure blocks before presentation
    steps:
      - state: publication_credentials
        event: associated_credentials_verified
        target: publication_smoke
      - {state: publication_smoke, event: public_smoke_failed, target: blocked}
    terminal: blocked
    excludes: [saved_present]

  - name: public save can require owner selection
    steps:
      - {state: public_owner, event: public_owner_choice_required, target: public_owner_offer}
      - {state: public_owner_offer, event: public_owner_selected, target: public_publish}
      - state: public_publish
        event: play_published
        guards: {publication_is_public: true}
        target: birth_bind
      - state: birth_bind
        event: birth_bound
        target: index
      - state: index
        event: play_indexed
        guards: {exact_published_version_is_indexed: true}
        target: saved_inspect
      - state: saved_inspect
        event: saved_play_inspected
        guards: {saved_public_inspection_matches_publication: true, saved_inspection_matches_publication: true}
        target: publication_credentials
      - {state: publication_credentials, event: associated_credentials_verified, target: publication_smoke}
      - {state: publication_smoke, event: public_smoke_verified, target: saved_present}
      - {state: saved_present, event: saved_play_presented, target: completed}
    terminal: completed

  - name: explicit organization summary bypasses Play search
    steps:
      - {state: qualify, event: play_management_request, target: management_list}
      - {state: management_list, event: management_inventory_ready, target: management_present}
      - {state: management_present, event: management_presented, target: completed}
    terminal: completed
    excludes: [search, explore_offer, author_release]

  - name: ambiguous Play list uses structured view selection
    steps:
      - {state: qualify, event: play_management_choice_required, target: management_offer}
      - {state: management_offer, event: management_views_selected, target: management_list}
      - {state: management_list, event: management_inventory_ready, target: management_present}
      - {state: management_present, event: management_presented, target: completed}
    terminal: completed
    excludes: [search, explore_offer]

  - name: owner can retrieve a local Play birth certificate
    steps:
      - {state: qualify, event: play_birth_request, target: birth_show}
      - {state: birth_show, event: birth_ready, target: completed}
    terminal: completed
    excludes: [search, use_run, explore_offer]

  - name: declined modality widening blocks exploration
    steps:
      - state: explore_route
        event: route_selected
        guards: {route_within_policy: false}
        target: modality_offer
      - {state: modality_offer, event: modality_widening_declined, target: blocked}
    terminal: blocked

  - name: CALL blocks when rote-using-adapters is unavailable
    steps:
      - state: explore_route
        event: route_selected
        guards: {route_within_policy: true}
        target: explore_dispatch
      - {state: explore_dispatch, event: adapter_discovery_required, target: adapter_discover}
      - {state: adapter_discover, event: adapter_catalog_empty, target: explore_handoff}
      - {state: explore_handoff, event: specialist_unavailable, target: blocked}
    terminal: blocked
    excludes: [explore_execute, explore_receipt, explore_verify]

  - name: CALL presents every catalog match before specialist preparation
    steps:
      - state: explore_route
        event: route_selected
        guards: {route_within_policy: true}
        target: explore_dispatch
      - {state: explore_dispatch, event: adapter_discovery_required, target: adapter_discover}
      - {state: adapter_discover, event: adapter_choices_ready, target: adapter_offer}
      - {state: adapter_offer, event: adapter_source_selected, target: explore_handoff}
    terminal: explore_handoff
    includes_once: [adapter_discover, adapter_offer]

  - name: rejected catalog matches permit later spec discovery
    steps:
      - {state: adapter_discover, event: adapter_choices_ready, target: adapter_offer}
      - {state: adapter_offer, event: adapter_catalog_rejected, target: explore_handoff}
    terminal: explore_handoff

  - name: raw direct-tool output cannot pass specialist receipt validation
    steps:
      - {state: explore_execute, event: outcome_ready, target: explore_receipt}
      - {state: explore_receipt, event: specialist_receipt_invalid, target: blocked}
    terminal: blocked
    excludes: [explore_verify]

  - name: exhausted route retries only within budget
    steps:
      - state: explore_execute
        event: route_exhausted
        target: explore_receipt
      - state: explore_receipt
        event: specialist_route_exhausted
        guards: {exploration_budget_remaining: true}
        target: explore_route
      - {state: explore_route, event: no_safe_route, target: blocked}
    terminal: blocked

  - name: controller drift enters the declared repair path
    steps:
      - {state: use_run, event: play_drifted, target: repair_offer}
      - {state: repair_offer, event: ordinary_execution_selected, target: exited}
    terminal: exited

  - name: incomplete run output cannot reach verification
    steps:
      - {state: use_output, event: action_blocked, target: repair_offer}
      - {state: repair_offer, event: ordinary_execution_selected, target: exited}
    terminal: exited
    excludes: [use_verify, use_receipt, receipt]

  - name: drift can enter consented repair exploration
    steps:
      - {state: use_run, event: play_drifted, target: repair_offer}
      - {state: repair_offer, event: repair_approved, target: explore_prepare}
      - state: explore_prepare
        event: exploration_ready
        guards: {explore_is_approved: true}
        target: explore_route
    terminal: explore_route

  - name: awareness selection enters inspected Use without Explore
    steps:
      - {state: qualify, event: play_awareness_request, target: awareness_collect}
      - {state: awareness_collect, event: awareness_ready, target: awareness_present}
      - {state: awareness_present, event: awareness_presented, target: awareness_offer}
      - {state: awareness_offer, event: awareness_play_selected, target: use_inspect}
      - {state: use_inspect, event: play_inspected, target: use_offer}
      - {state: use_offer, event: play_run_approved, target: use_run}
      - {state: use_run, event: play_run_ready, target: use_output}
      - {state: use_output, event: detailed_output_ready, target: use_verify}
      - {state: use_verify, event: outcome_verified, target: use_receipt}
      - {state: use_receipt, event: receipt_ready, target: receipt}
    terminal: receipt
    excludes: [explore_offer, explore_prepare, crystallize]

  - name: unchanged awareness closes without an action prompt
    steps:
      - {state: qualify, event: play_awareness_request, target: awareness_collect}
      - {state: awareness_collect, event: awareness_unchanged, target: completed}
    terminal: completed
    excludes: [awareness_present, awareness_offer]

  - name: awareness can collect a need before normal search
    steps:
      - {state: awareness_offer, event: awareness_search_selected, target: awareness_need}
      - {state: awareness_need, event: awareness_need_described, target: search}
    terminal: search

  - name: explicit creator intent skips redundant Explore prompt
    steps:
      - {state: qualify, event: play_creation_request, target: creator_search}
      - state: creator_search
        event: creator_search_ready
        guards: {search_is_complete: true}
        target: creator_classify
      - {state: creator_classify, event: creator_no_match, target: explore_prepare}
      - state: explore_prepare
        event: exploration_ready
        guards: {explore_is_approved: true}
        target: explore_route
    terminal: explore_route
    excludes: [explore_offer]

  - name: creator can choose an adequate existing Play
    steps:
      - {state: creator_classify, event: creator_match_ready, target: creator_offer}
      - {state: creator_offer, event: creator_use_selected, target: use_inspect}
      - {state: use_inspect, event: play_inspected, target: use_offer}
    terminal: use_offer
