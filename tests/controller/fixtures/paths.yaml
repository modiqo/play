schema: play.conformance-paths/v1

cases:
  - name: empty Play invocation greets an authenticated Rote user
    steps:
      - {state: invoke, event: empty_play_invocation, target: onboarding_probe}
      - state: onboarding_probe
        event: rote_available
        guards: {onboarding_is_greeting: true, onboarding_is_play_uri: false}
        target: onboarding_identity
      - state: onboarding_identity
        event: onboarding_identity_ready
        guards: {onboarding_is_greeting: true, onboarding_is_play_uri: false}
        target: onboarding_experience
      - {state: onboarding_experience, event: onboarding_returning, target: onboarding_welcome}
      - {state: onboarding_welcome, event: welcome_request_described, target: invoke}
      - {state: invoke, event: ordinary_play_invocation, target: qualify}
      - {state: qualify, event: conversation, target: exited}
    terminal: exited
    includes_once: [onboarding_probe, onboarding_identity, onboarding_experience, onboarding_welcome]

  - name: empty Play invocation hands missing Rote to setup then reprobes
    steps:
      - {state: invoke, event: empty_play_invocation, target: onboarding_probe}
      - state: onboarding_probe
        event: rote_missing
        guards: {onboarding_is_greeting: true, onboarding_is_play_uri: false}
        target: onboarding_setup
      - {state: onboarding_setup, event: rote_setup_completed, target: onboarding_probe}
      - state: onboarding_probe
        event: rote_available
        guards: {onboarding_is_greeting: true, onboarding_is_play_uri: false}
        target: onboarding_identity
      - state: onboarding_identity
        event: onboarding_identity_ready
        guards: {onboarding_is_greeting: true, onboarding_is_play_uri: false}
        target: onboarding_experience
      - {state: onboarding_experience, event: onboarding_first_use, target: onboarding_first_present}
      - {state: onboarding_first_present, event: onboarding_first_use_presented, target: onboarding_first_record}
      - {state: onboarding_first_record, event: onboarding_first_use_recorded, target: onboarding_first_offer}
      - {state: onboarding_first_offer, event: onboarding_dismissed, target: completed}
    terminal: completed
    includes_once: [onboarding_setup, onboarding_identity, onboarding_experience, onboarding_first_present, onboarding_first_record, onboarding_first_offer]

  - name: first-use Hello preserves inspection approval detail verification and activation
    steps:
      - {state: onboarding_first_offer, event: onboarding_starter_selected, target: use_inspect}
      - {state: use_inspect, event: play_inspected, target: use_decide}
      - {state: use_decide, event: remote_pull_required, target: use_offer}
      - {state: use_offer, event: play_run_approved, target: use_prepare}
      - {state: use_prepare, event: play_run_handoff_ready, target: use_run}
      - {state: use_run, event: play_run_ready, target: use_verify}
      - {state: use_verify, event: outcome_verified, target: use_receipt}
      - state: use_receipt
        event: receipt_ready
        guards: {use_is_onboarding_starter: true}
        target: onboarding_result_offer
      - {state: onboarding_result_offer, event: onboarding_result_replay_requested, target: onboarding_result_replay}
      - {state: onboarding_result_replay, event: onboarding_result_replayed, target: onboarding_result_offer}
      - {state: onboarding_result_offer, event: onboarding_result_confirmed, target: onboarding_activation_present}
      - {state: onboarding_activation_present, event: onboarding_activation_presented, target: onboarding_activation_offer}
      - {state: onboarding_activation_offer, event: onboarding_finished, target: receipt}
    terminal: receipt
    includes_once: [use_inspect, use_offer, use_run, use_verify, use_receipt, onboarding_result_replay, onboarding_activation_present, onboarding_activation_offer]

  - name: first-use team creation reuses the typed colleague invite loop
    steps:
      - {state: onboarding_first_offer, event: onboarding_team_selected, target: onboarding_team_handle}
      - {state: onboarding_team_handle, event: team_handle_described, target: onboarding_team_create}
      - {state: onboarding_team_create, event: team_space_ready, target: onboarding_team_present}
      - {state: onboarding_team_present, event: team_loop_presented, target: team_invite_offer}
      - {state: team_invite_offer, event: team_invite_selected, target: team_invite_email}
      - {state: team_invite_email, event: team_invite_described, target: team_invite_execute}
      - {state: team_invite_execute, event: team_invite_ready, target: team_invite_offer}
      - {state: team_invite_offer, event: team_onboarding_finished, target: completed}
    terminal: completed
    includes_once: [onboarding_team_handle, onboarding_team_create, onboarding_team_present, team_invite_email, team_invite_execute]

  - name: Play URI uses first-class inspection when Rote is installed
    steps:
      - {state: invoke, event: play_uri_invocation, target: onboarding_probe}
      - state: onboarding_probe
        event: rote_available
        guards: {onboarding_is_greeting: false, onboarding_is_play_uri: true}
        target: onboarding_identity
      - state: onboarding_identity
        event: onboarding_identity_ready
        guards: {onboarding_is_greeting: false, onboarding_is_play_uri: true}
        target: use_inspect
      - {state: use_inspect, event: play_inspected, target: use_decide}
      - {state: use_decide, event: remote_pull_required, target: use_offer}
      - {state: use_offer, event: play_run_declined, target: completed}
    terminal: completed
    excludes: [onboarding_card_fetch, onboarding_setup, use_run]

  - name: Play URI reads its public card when Rote is missing
    steps:
      - {state: invoke, event: play_uri_invocation, target: onboarding_probe}
      - state: onboarding_probe
        event: rote_missing
        guards: {onboarding_is_greeting: false, onboarding_is_play_uri: true}
        target: onboarding_card_fetch
      - {state: onboarding_card_fetch, event: onboarding_play_card_ready, target: onboarding_card_present}
      - {state: onboarding_card_present, event: onboarding_play_card_presented, target: onboarding_card_offer}
      - {state: onboarding_card_offer, event: onboarding_card_dismissed, target: completed}
    terminal: completed
    excludes: [onboarding_identity, onboarding_setup, use_inspect, use_run]

  - name: pasted Play URI without Rote can begin guided setup and reach the exact Play
    steps:
      - {state: invoke, event: play_uri_invocation, target: onboarding_probe}
      - state: onboarding_probe
        event: rote_missing
        guards: {onboarding_is_greeting: false, onboarding_is_play_uri: true}
        target: onboarding_card_fetch
      - {state: onboarding_card_fetch, event: onboarding_play_card_ready, target: onboarding_card_present}
      - {state: onboarding_card_present, event: onboarding_play_card_presented, target: onboarding_card_offer}
      - {state: onboarding_card_offer, event: onboarding_uri_setup_selected, target: onboarding_setup}
      - {state: onboarding_setup, event: rote_setup_completed, target: onboarding_probe}
      - state: onboarding_probe
        event: rote_available
        guards: {onboarding_is_greeting: false, onboarding_is_play_uri: true}
        target: onboarding_identity
      - state: onboarding_identity
        event: onboarding_identity_ready
        guards: {onboarding_is_greeting: false, onboarding_is_play_uri: true}
        target: use_inspect
      - {state: use_inspect, event: play_inspected, target: use_decide}
      - {state: use_decide, event: remote_pull_required, target: use_offer}
    terminal: use_offer
    includes_once: [onboarding_card_offer, onboarding_setup]
    excludes: [qualify, search]

  - name: installed but logged-out Rote offers Google login then reprobes identity
    steps:
      - {state: invoke, event: empty_play_invocation, target: onboarding_probe}
      - state: onboarding_probe
        event: rote_available
        guards: {onboarding_is_greeting: true, onboarding_is_play_uri: false}
        target: onboarding_identity
      - {state: onboarding_identity, event: onboarding_identity_setup_required, target: onboarding_login_offer}
      - {state: onboarding_login_offer, event: onboarding_google_login_selected, target: onboarding_login}
      - {state: onboarding_login, event: rote_login_completed, target: onboarding_identity}
      - state: onboarding_identity
        event: onboarding_identity_ready
        guards: {onboarding_is_greeting: true, onboarding_is_play_uri: false}
        target: onboarding_experience
    terminal: onboarding_experience
    includes_once: [onboarding_login_offer, onboarding_login]

  - name: installed but logged-out Rote can defer login without running the request
    steps:
      - {state: onboarding_identity, event: onboarding_identity_setup_required, target: onboarding_login_offer}
      - {state: onboarding_login_offer, event: onboarding_login_deferred, target: completed}
    terminal: completed
    excludes: [onboarding_login, use_inspect, use_run]

  - name: missing setup specialist blocks without installing directly
    steps:
      - {state: onboarding_setup, event: setup_specialist_unavailable, target: blocked}
    terminal: blocked

  - name: non-outcome conversation exits without any standby write
    steps:
      - {state: qualify, event: conversation, target: exited}
    terminal: exited
    excludes: [standby_exit]

  - name: explicit exclusion records scoped preferences before exiting
    steps:
      - {state: qualify, event: play_excluded, target: standby_exit}
      - {state: standby_exit, event: standby_recorded, guards: {capture_is_active: false}, target: exited}
    terminal: exited
    excludes: [search, save_judge]

  - name: explicit Play search can keep merged results without running
    steps:
      - {state: qualify, event: play_search_request, target: search}
      - state: search
        event: search_ready
        guards: {search_only_requested: true, search_is_complete: true}
        target: search_present
      - {state: search_present, event: search_presented, target: search_offer}
      - {state: search_offer, event: search_dismissed, target: completed}
    terminal: completed
    excludes: [classify, use_inspect, use_run, standby_exit]

  - name: unqualified named Play run asks the user to select a qualified reference
    steps:
      - {state: invoke, event: play_search_invocation, target: search}
      - state: search
        event: search_ready
        guards: {search_only_requested: true, search_is_complete: true}
        target: search_present
      - {state: search_present, event: search_presented, target: search_offer}
      - {state: search_offer, event: search_play_selected, target: use_inspect}
      - {state: use_inspect, event: play_inspected, target: use_decide}
      - {state: use_decide, event: remote_pull_required, target: use_offer}
      - {state: use_offer, event: play_run_declined, target: completed}
    terminal: completed
    excludes: [qualify, classify, use_run, standby_exit]

  - name: explicit Play search inspects an organization result before approval
    steps:
      - {state: qualify, event: play_search_request, target: search}
      - state: search
        event: search_ready
        guards: {search_only_requested: true, search_is_complete: true}
        target: search_present
      - {state: search_present, event: search_presented, target: search_offer}
      - {state: search_offer, event: search_play_selected, target: use_inspect}
      - {state: use_inspect, event: play_inspected, target: use_decide}
      - {state: use_decide, event: remote_pull_required, target: use_offer}
      - {state: use_offer, event: play_run_declined, target: completed}
    terminal: completed
    excludes: [classify, use_run, standby_exit]

  - name: empty explicit Play search presents the result and stops
    steps:
      - {state: qualify, event: play_search_request, target: search}
      - state: search
        event: search_ready
        guards: {search_only_requested: true, search_is_complete: true}
        target: search_present
      - {state: search_present, event: search_empty, target: completed}
    terminal: completed
    excludes: [classify, standby_exit, exploration_begin, use_inspect, use_run]

  - name: setup-led exploration asks for a useful goal after connection
    steps:
      - {state: exploration_execute, event: exploration_prerequisite_ready, target: exploration_prerequisite_present}
      - state: exploration_prerequisite_present
        event: exploration_prerequisite_presented
        guards: {exploration_goal_is_ready: false, exploration_goal_is_required: true}
        target: exploration_goal_offer
      - {state: exploration_goal_offer, event: exploration_goal_supplied, target: exploration_execute}
      - {state: exploration_execute, event: exploration_outcome_ready, target: exploration_verify}
      - {state: exploration_verify, event: outcome_verified, target: exploration_complete_present}
      - {state: exploration_complete_present, event: exploration_completion_presented, target: save_judge}
      - {state: save_judge, event: not_worth_saving, target: exploration_one_off_present}
      - {state: exploration_one_off_present, event: exploration_one_off_presented, target: exited}
    terminal: exited
    excludes: [search, creator_search, standby_exit]

  - name: goal-bound exploration resumes automatically after connection
    steps:
      - {state: exploration_execute, event: exploration_prerequisite_ready, target: exploration_prerequisite_present}
      - state: exploration_prerequisite_present
        event: exploration_prerequisite_presented
        guards: {exploration_goal_is_ready: true, exploration_goal_is_required: false}
        target: exploration_execute
      - {state: exploration_execute, event: exploration_outcome_ready, target: exploration_verify}
      - {state: exploration_verify, event: outcome_verified, target: exploration_complete_present}
      - {state: exploration_complete_present, event: exploration_completion_presented, target: save_judge}
      - {state: save_judge, event: not_worth_saving, target: exploration_one_off_present}
      - {state: exploration_one_off_present, event: exploration_one_off_presented, target: exited}
    terminal: exited
    excludes: [exploration_goal_offer, search, creator_search]

  - name: existing local publication fails closed without provenance and never searches
    steps:
      - {state: qualify, event: play_publication_request, target: local_release_inspect}
      - {state: local_release_inspect, event: local_release_unavailable, target: blocked}
    terminal: blocked
    excludes: [search, creator_search, exploration_execute, author_release, public_publish]

  - name: exact Play reference is inspected and approved before first-class execution
    steps:
      - {state: qualify, event: exact_play_request, target: use_inspect}
      - {state: use_inspect, event: play_inspected, target: use_decide}
      - {state: use_decide, event: remote_pull_required, target: use_offer}
      - {state: use_offer, event: play_run_approved, target: use_prepare}
      - {state: use_prepare, event: play_run_handoff_ready, target: use_run}
      - {state: use_run, event: play_run_ready, target: use_verify}
      - {state: use_verify, event: outcome_verified, target: use_receipt}
      - {state: use_receipt, event: receipt_ready, target: receipt}
    terminal: receipt
    excludes: [search, classify, author_release, birth_capture, private_publish, public_publish, birth_bind, index]

  - name: unresolved exact reference returns to normal work after empty search
    steps:
      - {state: qualify, event: exact_play_request, target: use_inspect}
      - {state: use_inspect, event: play_reference_unresolved, target: search}
      - {state: search, event: search_ready, guards: {search_is_complete: true}, target: classify}
      - {state: classify, event: no_match, target: exited}
    terminal: exited
    excludes: [standby_exit, exploration_begin, use_run]

  - name: discovered adequate Play also runs through the first-class controller
    steps:
      - {state: qualify, event: outcome_request, target: search}
      - {state: search, event: search_ready, guards: {search_is_complete: true}, target: classify}
      - state: classify
        event: full_match
        guards: {match_satisfies_constraints: true}
        target: use_inspect
      - {state: use_inspect, event: play_inspected, target: use_decide}
      - {state: use_decide, event: remote_pull_required, target: use_offer}
      - {state: use_offer, event: play_run_approved, target: use_prepare}
      - {state: use_prepare, event: play_run_handoff_ready, target: use_run}
      - {state: use_run, event: play_run_ready, target: use_verify}
      - {state: use_verify, event: outcome_verified, target: use_receipt}
      - {state: use_receipt, event: receipt_ready, target: receipt}
    terminal: receipt

  - name: inadequate full match returns to normal work
    steps:
      - {state: qualify, event: outcome_request, target: search}
      - {state: search, event: search_ready, guards: {search_is_complete: true}, target: classify}
      - state: classify
        event: full_match
        guards: {match_satisfies_constraints: false}
        target: exited
    terminal: exited
    excludes: [standby_exit, use_inspect, save_judge]

  - name: no match returns to normal work without offering exploration
    steps:
      - {state: qualify, event: outcome_request, target: search}
      - {state: search, event: search_ready, guards: {search_is_complete: true}, target: classify}
      - {state: classify, event: no_match, target: exited}
    terminal: exited
    excludes: [standby_exit, exploration_begin, use_inspect, crystallize]

  - name: settled one-off work exits without a save offer
    steps:
      - {state: invoke, event: settled_task_invocation, target: save_judge}
      - {state: save_judge, event: not_worth_saving, target: exploration_one_off_present}
      - {state: exploration_one_off_present, event: exploration_one_off_presented, target: exited}
    terminal: exited
    excludes: [qualify, search, crystallize, save_offer]

  - name: settled repeatable work can skip saving at the offer
    steps:
      - {state: invoke, event: settled_task_invocation, target: save_judge}
      - {state: save_judge, event: worth_saving, target: crystallize}
      - state: crystallize
        event: candidate_ready
        guards: {captured_trajectory_is_verified: true}
        target: save_prepare
      - {state: save_prepare, event: public_owner_context_ready, target: save_offer}
      - {state: save_offer, event: save_skipped, target: completed}
    terminal: completed
    excludes: [qualify, search, author_release, birth_capture, private_org, private_publish, public_publish, birth_bind, index]

  - name: a legacy Play without auth ensure can use specialist authentication after failure
    steps:
      - {state: use_run, event: play_authentication_required, target: use_authentication_offer}
      - {state: use_authentication_offer, event: authentication_approved, target: use_authentication_execute}
      - {state: use_authentication_execute, event: authentication_ready, target: use_inspect}
      - {state: use_inspect, event: play_inspected, target: use_decide}
      - {state: use_decide, event: local_play_ready, target: use_prepare}
      - {state: use_prepare, event: play_run_handoff_ready, target: use_run}
      - {state: use_run, event: play_run_ready, target: use_verify}
      - {state: use_verify, event: outcome_verified, target: use_receipt}
      - {state: use_receipt, event: receipt_ready, target: receipt}
    terminal: receipt
    includes_once: [use_authentication_offer, use_authentication_execute]

  - name: a static token already set is verified before the exact retry
    steps:
      - {state: use_run, event: play_authentication_required, target: use_authentication_offer}
      - {state: use_authentication_offer, event: authentication_verification_requested, guards: {authentication_is_static: true}, target: use_prepare}
      - {state: use_prepare, event: play_run_handoff_ready, target: use_run}
      - {state: use_run, event: play_run_ready, target: use_verify}
      - {state: use_verify, event: outcome_verified, target: use_receipt}
      - {state: use_receipt, event: receipt_ready, target: receipt}
    terminal: receipt
    excludes: [use_authentication_execute]

  - name: declined legacy authentication blocks without retrying
    steps:
      - {state: use_run, event: play_authentication_required, target: use_authentication_offer}
      - {state: use_authentication_offer, event: authentication_declined, target: blocked}
    terminal: blocked
    excludes: [use_authentication_execute]

  - name: failed legacy authentication blocks before retry
    steps:
      - {state: use_authentication_execute, event: authentication_failed, target: blocked}
    terminal: blocked
    excludes: [use_inspect, use_run]

  - name: private save publishes to a private org and indexes
    steps:
      - {state: invoke, event: settled_task_invocation, target: save_judge}
      - {state: save_judge, event: worth_saving, target: crystallize}
      - state: crystallize
        event: candidate_ready
        guards: {captured_trajectory_is_verified: true}
        target: save_prepare
      - {state: save_prepare, event: public_owner_context_ready, target: save_offer}
      - {state: save_offer, event: save_private, target: author_release}
      - state: author_release
        event: flow_released
        guards: {released_candidate_is_unpublished: true}
        target: birth_capture
      - state: birth_capture
        event: birth_captured
        guards: {save_choice_private: true, save_choice_public: false}
        target: private_org
      - state: private_org
        event: private_org_ready
        guards: {private_org_policy_satisfied: true}
        target: private_publish
      - state: private_publish
        event: play_published
        guards: {private_publication_matches_captured_birth: true}
        target: birth_bind
      - state: birth_bind
        event: birth_bound
        target: index
      - state: index
        event: play_indexed
        guards: {exact_published_version_is_indexed: true}
        target: saved_inspect
      - state: saved_inspect
        event: saved_play_inspected
        guards: {saved_public_inspection_matches_publication: false, saved_inspection_matches_publication: true}
        target: birth_present
      - state: birth_present
        event: birth_certificate_presented
        guards: {save_choice_private: true}
        target: team_invite_offer
      - {state: team_invite_offer, event: team_onboarding_finished, target: completed}
    terminal: completed
    includes_once: [author_release, birth_capture, private_org, private_publish, birth_bind, index, team_invite_offer]

  - name: direct registry publication during release blocks without a retrospective birth
    steps:
      - state: author_release
        event: publication_boundary_violated
        target: blocked
    terminal: blocked
    excludes: [birth_capture, private_publish, public_publish, birth_bind, birth_present, completed]

  - name: public save with known owner publishes and indexes
    steps:
      - {state: invoke, event: settled_task_invocation, target: save_judge}
      - {state: save_judge, event: worth_saving, target: crystallize}
      - state: crystallize
        event: candidate_ready
        guards: {captured_trajectory_is_verified: true}
        target: save_prepare
      - {state: save_prepare, event: public_owner_context_ready, target: save_offer}
      - state: save_offer
        event: save_public
        guards: {public_owner_is_resolved: true, public_owner_choice_is_required: false}
        target: author_release
      - state: author_release
        event: flow_released
        guards: {released_candidate_is_unpublished: true}
        target: birth_capture
      - state: birth_capture
        event: birth_captured
        guards: {save_choice_private: false, save_choice_public: true}
        target: public_publish
      - state: public_publish
        event: play_published
        guards: {public_publication_matches_captured_birth: true}
        target: birth_bind
      - state: birth_bind
        event: birth_bound
        target: index
      - state: index
        event: play_indexed
        guards: {exact_published_version_is_indexed: true}
        target: saved_inspect
      - state: saved_inspect
        event: saved_play_inspected
        guards: {saved_public_inspection_matches_publication: true, saved_inspection_matches_publication: true}
        target: publication_credentials
      - {state: publication_credentials, event: associated_credentials_verified, target: publication_smoke}
      - {state: publication_smoke, event: public_smoke_verified, target: birth_present}
      - {state: birth_present, event: birth_certificate_presented, target: completed}
    terminal: completed
    includes_once: [save_prepare, author_release, birth_capture, public_publish, birth_bind, index, publication_credentials, publication_smoke]

  - name: public credential mismatch blocks before smoke and presentation
    steps:
      - state: saved_inspect
        event: saved_play_inspected
        guards: {saved_public_inspection_matches_publication: true, saved_inspection_matches_publication: true}
        target: publication_credentials
      - {state: publication_credentials, event: associated_credentials_invalid, target: blocked}
    terminal: blocked
    excludes: [publication_smoke, birth_present]

  - name: public smoke failure blocks before presentation
    steps:
      - state: publication_credentials
        event: associated_credentials_verified
        target: publication_smoke
      - {state: publication_smoke, event: public_smoke_failed, target: blocked}
    terminal: blocked
    excludes: [birth_present]

  - name: public save can require owner selection
    steps:
      - {state: save_prepare, event: public_owner_context_ready, target: save_offer}
      - state: save_offer
        event: save_public
        guards: {public_owner_is_resolved: false, public_owner_choice_is_required: true}
        target: public_owner_offer
      - {state: public_owner_offer, event: public_owner_selected, target: author_release}
      - state: author_release
        event: flow_released
        guards: {released_candidate_is_unpublished: true}
        target: birth_capture
      - state: birth_capture
        event: birth_captured
        guards: {save_choice_private: false, save_choice_public: true}
        target: public_publish
      - state: public_publish
        event: play_published
        guards: {public_publication_matches_captured_birth: true}
        target: birth_bind
      - state: birth_bind
        event: birth_bound
        target: index
      - state: index
        event: play_indexed
        guards: {exact_published_version_is_indexed: true}
        target: saved_inspect
      - state: saved_inspect
        event: saved_play_inspected
        guards: {saved_public_inspection_matches_publication: true, saved_inspection_matches_publication: true}
        target: publication_credentials
      - {state: publication_credentials, event: associated_credentials_verified, target: publication_smoke}
      - {state: publication_smoke, event: public_smoke_verified, target: birth_present}
      - {state: birth_present, event: birth_certificate_presented, target: completed}
    terminal: completed

  - name: unavailable namespace probe blocks only a Public selection
    steps:
      - {state: save_prepare, event: public_owner_context_unavailable, target: save_offer}
      - state: save_offer
        event: save_public
        guards: {public_owner_is_resolved: false, public_owner_choice_is_required: false}
        target: blocked
    terminal: blocked
    excludes: [public_owner_offer, author_release, birth_capture, public_publish]

  - name: explicit organization summary bypasses Play search
    steps:
      - {state: qualify, event: play_management_request, target: management_list}
      - {state: management_list, event: management_inventory_ready, target: management_present}
      - {state: management_present, event: management_presented, target: completed}
    terminal: completed
    excludes: [search, standby_exit, author_release]

  - name: ambiguous Play list uses structured view selection
    steps:
      - {state: qualify, event: play_management_choice_required, target: management_offer}
      - {state: management_offer, event: management_views_selected, target: management_list}
      - {state: management_list, event: management_inventory_ready, target: management_present}
      - {state: management_present, event: management_presented, target: completed}
    terminal: completed
    excludes: [search, standby_exit]

  - name: owner can retrieve a local Play birth certificate
    steps:
      - {state: qualify, event: play_birth_request, target: birth_show}
      - {state: birth_show, event: birth_ready, target: completed}
    terminal: completed
    excludes: [search, use_run, standby_exit]

  - name: controller drift arms the save hook instead of a repair dialog
    steps:
      - {state: use_run, event: play_drifted, target: standby_exit}
      - {state: standby_exit, event: standby_recorded, target: exited}
    terminal: exited
    excludes: [use_verify, use_receipt, receipt]

  - name: incomplete run output cannot reach verification
    steps:
      - {state: use_run, event: action_blocked, target: blocked}
    terminal: blocked
    excludes: [use_verify, use_receipt, receipt]

  - name: unverified use output steps aside for ordinary work
    steps:
      - {state: use_verify, event: outcome_not_verified, target: standby_exit}
      - {state: standby_exit, event: standby_recorded, target: exited}
    terminal: exited
    excludes: [use_receipt, receipt]

  - name: awareness selection enters inspected Use directly
    steps:
      - {state: qualify, event: play_awareness_request, target: awareness_collect}
      - {state: awareness_collect, event: awareness_ready, target: awareness_present}
      - {state: awareness_present, event: awareness_presented, target: awareness_offer}
      - {state: awareness_offer, event: awareness_play_selected, target: use_inspect}
      - {state: use_inspect, event: play_inspected, target: use_decide}
      - {state: use_decide, event: remote_pull_required, target: use_offer}
      - {state: use_offer, event: play_run_approved, target: use_prepare}
      - {state: use_prepare, event: play_run_handoff_ready, target: use_run}
      - {state: use_run, event: play_run_ready, target: use_verify}
      - {state: use_verify, event: outcome_verified, target: use_receipt}
      - {state: use_receipt, event: receipt_ready, target: receipt}
    terminal: receipt
    excludes: [standby_exit, crystallize]

  - name: unchanged awareness still presents the current catalog
    steps:
      - {state: qualify, event: play_awareness_request, target: awareness_collect}
      - {state: awareness_collect, event: awareness_unchanged, target: awareness_present}
      - {state: awareness_present, event: awareness_presented, target: awareness_offer}
      - {state: awareness_offer, event: awareness_dismissed, target: completed}
    terminal: completed
    includes_once: [awareness_present, awareness_offer]

  - name: awareness can collect a need before normal search
    steps:
      - {state: awareness_offer, event: awareness_search_selected, target: awareness_need}
      - {state: awareness_need, event: awareness_need_described, target: search}
    terminal: search

  - name: explicit creator intent starts captured exploration after no match
    steps:
      - {state: qualify, event: play_creation_request, target: creator_search}
      - state: creator_search
        event: creator_search_ready
        guards: {search_is_complete: true}
        target: creator_classify
      - {state: creator_classify, event: creator_no_match, target: standby_exit}
      - {state: standby_exit, event: standby_recorded, guards: {capture_is_active: true}, target: exploration_begin}
      - {state: exploration_begin, event: exploration_started, target: exploration_execute}
      - {state: exploration_execute, event: exploration_outcome_ready, target: exploration_verify}
      - {state: exploration_verify, event: outcome_verified, target: exploration_complete_present}
      - {state: exploration_complete_present, event: exploration_completion_presented, target: save_judge}
      - {state: save_judge, event: not_worth_saving, target: exploration_one_off_present}
      - {state: exploration_one_off_present, event: exploration_one_off_presented, target: exited}
    terminal: exited
    excludes: [crystallize]

  - name: creator can choose an adequate existing Play
    steps:
      - {state: creator_classify, event: creator_match_ready, target: creator_offer}
      - {state: creator_offer, event: creator_use_selected, target: use_inspect}
      - {state: use_inspect, event: play_inspected, target: use_decide}
      - {state: use_decide, event: remote_pull_required, target: use_offer}
    terminal: use_offer

  - name: creator can choose to adapt an existing Play through captured Rote exploration
    steps:
      - {state: creator_classify, event: creator_match_ready, target: creator_offer}
      - {state: creator_offer, event: creator_adapt_selected, target: standby_exit}
      - {state: standby_exit, event: standby_recorded, guards: {capture_is_active: true}, target: exploration_begin}
      - {state: exploration_begin, event: exploration_started, target: exploration_execute}
      - {state: exploration_execute, event: exploration_outcome_ready, target: exploration_verify}
      - {state: exploration_verify, event: outcome_verified, target: exploration_complete_present}
      - {state: exploration_complete_present, event: exploration_completion_presented, target: save_judge}
      - {state: save_judge, event: not_worth_saving, target: exploration_one_off_present}
      - {state: exploration_one_off_present, event: exploration_one_off_presented, target: exited}
    terminal: exited
    excludes: [use_inspect]
