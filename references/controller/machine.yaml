schema: play.machine/v1
machine: play
initial: invoke
terminal: [receipt, completed, exited, blocked]

states:
  invoke:
    owner: play
    checkpoint: after
    requires: [request.original]
    entry: {action: classify_play_invocation}
    "on":
      empty_play_invocation: [{target: onboarding_probe, mutate: start_greeting_onboarding}]
      play_uri_invocation: [{target: onboarding_probe, mutate: start_uri_onboarding}]
      ordinary_play_invocation: [{target: qualify, mutate: record_ordinary_invocation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_probe:
    owner: play
    checkpoint: both
    requires: [onboarding.intent]
    entry: {action: probe_rote_for_onboarding}
    "on":
      rote_available:
        - {guard: onboarding_is_greeting, target: onboarding_identity, mutate: record_rote_probe}
        - {guard: onboarding_is_play_uri, target: use_inspect, mutate: enter_onboarding_uri_use}
        - {target: blocked, mutate: record_onboarding_intent_mismatch}
      rote_missing:
        - {guard: onboarding_is_greeting, target: onboarding_setup, mutate: record_rote_probe}
        - {guard: onboarding_is_play_uri, target: onboarding_card_fetch, mutate: record_rote_probe}
        - {target: blocked, mutate: record_onboarding_intent_mismatch}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_identity:
    owner: play
    checkpoint: both
    requires: [onboarding.rote_status, onboarding.rote_command]
    entry: {action: inspect_onboarding_identity}
    "on":
      onboarding_identity_ready: [{target: onboarding_welcome, mutate: record_onboarding_identity}]
      onboarding_identity_setup_required: [{target: onboarding_setup, mutate: record_onboarding_identity}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_welcome:
    owner: play
    checkpoint: after
    requires: [onboarding.email, onboarding.email_handle]
    prompt: welcome_play_request
    "on":
      welcome_request_described: [{target: invoke, mutate: record_welcome_request}]

  onboarding_setup:
    owner: rote-specialist
    checkpoint: both
    requires: [onboarding.intent, onboarding.rote_status, onboarding.setup_status]
    entry: {action: handoff_rote_setup}
    "on":
      rote_setup_completed: [{target: onboarding_probe, mutate: record_rote_setup}]
      rote_setup_paused: [{target: blocked, mutate: record_rote_setup_pause}]
      setup_specialist_unavailable: [{target: blocked, mutate: record_setup_specialist_unavailable}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_card_fetch:
    owner: play
    checkpoint: both
    requires: [onboarding.play_uri, onboarding.rote_status]
    entry: {action: fetch_onboarding_play_card}
    "on":
      onboarding_play_card_ready: [{target: onboarding_card_present, mutate: record_onboarding_card}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_card_present:
    owner: play
    checkpoint: after
    requires: [onboarding.card]
    entry: {action: present_onboarding_play_card}
    "on":
      onboarding_play_card_presented: [{target: completed, mutate: record_onboarding_card_presentation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  qualify:
    owner: play
    checkpoint: after
    entry: {action: qualify_request}
    "on":
      outcome_request: [{target: search, mutate: set_request_contract}]
      exact_play_request: [{target: use_inspect, mutate: enter_direct_use}]
      play_search_request: [{target: search, mutate: set_search_request}]
      play_awareness_request: [{target: awareness_collect, mutate: set_awareness_request}]
      play_creation_request: [{target: creator_search, mutate: set_creator_request}]
      play_management_request: [{target: management_list, mutate: set_management_request}]
      play_management_choice_required: [{target: management_offer, mutate: record_management_choices}]
      play_birth_request: [{target: birth_show, mutate: set_birth_request}]
      conversation: [{target: exited, mutate: record_non_outcome_exit}]
      play_excluded: [{target: exited, mutate: record_explicit_exit}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  awareness_collect:
    owner: play
    checkpoint: both
    requires: [awareness.window_days]
    entry: {action: collect_awareness_digest}
    "on":
      awareness_ready: [{target: awareness_present, mutate: record_awareness_digest}]
      awareness_unchanged: [{target: completed, mutate: record_awareness_digest}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  awareness_present:
    owner: play
    checkpoint: after
    requires: [awareness.digest_ref]
    entry: {action: present_awareness_digest}
    "on":
      awareness_presented: [{target: awareness_offer, mutate: record_awareness_presentation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  awareness_offer:
    owner: play
    checkpoint: after
    prompt: select_awareness_action
    "on":
      awareness_play_selected: [{target: use_inspect, mutate: enter_awareness_use}]
      awareness_search_selected: [{target: awareness_need, mutate: record_awareness_search_choice}]
      awareness_create_selected: [{target: creator_need, mutate: record_awareness_create_choice}]
      awareness_dismissed: [{target: completed, mutate: record_awareness_dismissal}]

  awareness_need:
    owner: play
    checkpoint: after
    prompt: describe_awareness_need
    "on":
      awareness_need_described: [{target: search, mutate: set_awareness_search}]

  creator_need:
    owner: play
    checkpoint: after
    prompt: describe_creator_need
    "on":
      creator_need_described: [{target: creator_search, mutate: set_creator_need}]

  creator_search:
    owner: play
    checkpoint: both
    requires: [request.intent, request.requested_outcome, modality_policy]
    entry: {action: search_creator_plays}
    "on":
      creator_search_ready:
        - {guard: search_is_complete, target: creator_classify, mutate: record_creator_search}
        - {target: blocked, mutate: record_incomplete_search}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  creator_classify:
    owner: play
    checkpoint: after
    requires: [search.complete, search.result_refs]
    entry: {action: classify_creator_options}
    "on":
      creator_match_ready: [{target: creator_offer, mutate: record_creator_match}]
      creator_no_match: [{target: explore_prepare, mutate: approve_creator_explore}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  creator_offer:
    owner: play
    checkpoint: after
    prompt: choose_creator_path
    "on":
      creator_use_selected: [{target: use_inspect, mutate: enter_creator_use}]
      creator_adapt_selected: [{target: explore_prepare, mutate: approve_adapt_explore}]
      creator_create_selected: [{target: explore_prepare, mutate: approve_creator_explore}]

  management_offer:
    owner: play
    checkpoint: after
    prompt: select_management_views
    "on":
      management_views_selected: [{target: management_list, mutate: choose_management_views}]

  management_list:
    owner: rote-specialist
    checkpoint: both
    requires: [management.views]
    entry: {action: list_play_management}
    "on":
      management_inventory_ready: [{target: management_present, mutate: record_management_inventory}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  management_present:
    owner: play
    checkpoint: after
    requires: [management.views]
    entry: {action: present_play_management}
    "on":
      management_presented: [{target: completed, mutate: record_management_presentation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  birth_show:
    owner: play
    checkpoint: both
    requires: [birth.selector]
    entry: {action: show_play_birth}
    "on":
      birth_ready: [{target: completed, mutate: record_birth_presentation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  search:
    owner: play
    checkpoint: both
    requires: [request.intent, modality_policy]
    entry: {action: search_authorized_plays}
    "on":
      search_ready:
        - {guard: search_only_requested, target: search_present, mutate: record_search_results}
        - {guard: search_is_complete, target: classify, mutate: record_search_results}
        - {target: blocked, mutate: record_incomplete_search}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  search_present:
    owner: play
    checkpoint: after
    requires: [search.complete, search.results]
    entry: {action: present_search_results}
    "on":
      search_presented: [{target: search_offer, mutate: record_search_presentation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  search_offer:
    owner: play
    checkpoint: after
    prompt: choose_search_result
    "on":
      search_play_selected: [{target: use_inspect, mutate: enter_search_use}]
      search_dismissed: [{target: completed, mutate: record_search_dismissal}]

  classify:
    owner: play
    checkpoint: after
    requires: [search.complete, search.result_refs]
    entry: {action: classify_adequacy}
    "on":
      full_match:
        - {guard: match_satisfies_constraints, target: use_inspect, mutate: enter_use}
        - {target: explore_offer, mutate: downgrade_inadequate_match}
      partial_match: [{target: explore_offer, mutate: record_partial_match}]
      uncertain_match: [{target: explore_offer, mutate: record_uncertain_match}]
      no_match: [{target: explore_offer, mutate: record_no_match}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  use_inspect:
    owner: play
    checkpoint: both
    requires: [match.reference]
    entry: {action: inspect_registry_play}
    "on":
      play_inspected: [{target: use_offer, mutate: record_play_inspection}]
      play_not_runnable: [{target: completed, mutate: record_unrunnable_inspection}]
      play_reference_unresolved: [{target: search, mutate: recover_unresolved_reference}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  use_offer:
    owner: play
    checkpoint: after
    requires: [inspection.complete, inspection.exact_reference, inspection.disclosure_sha256]
    prompt: approve_play_run
    "on":
      play_run_approved: [{target: use_run, mutate: approve_inspected_run}]
      play_run_declined: [{target: completed, mutate: record_run_dismissal}]

  use_run:
    owner: flow-runtime
    checkpoint: both
    requires: [match.reference, inspection.exact_reference, inspection.disclosure_sha256]
    entry: {action: run_registry_play}
    "on":
      play_run_ready: [{target: use_output, mutate: record_controller_run}]
      play_drifted: [{target: repair_offer, mutate: record_failed_receipt}]
      action_blocked: [{target: repair_offer, mutate: record_failed_receipt}]

  use_output:
    owner: play
    checkpoint: both
    requires: [match.reference, play.version, output.mode, output.detail, output.source, output.format, output.primary, output.manifest, output.truncated]
    entry: {action: format_run_output}
    "on":
      detailed_output_ready: [{target: use_verify, mutate: record_formatted_output}]
      action_blocked: [{target: repair_offer, mutate: record_incomplete_output}]

  use_verify:
    owner: play
    checkpoint: after
    entry: {action: verify_outcome}
    "on":
      outcome_verified: [{target: use_receipt, mutate: record_verification}]
      play_drifted: [{target: repair_offer, mutate: record_failed_receipt}]
      outcome_not_verified: [{target: repair_offer, mutate: record_failed_receipt}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  use_receipt:
    owner: play
    checkpoint: after
    entry: {action: build_receipt}
    "on":
      receipt_ready: [{target: receipt, mutate: attach_receipt}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  repair_offer:
    owner: play
    checkpoint: after
    prompt: repair_or_exit
    "on":
      repair_approved: [{target: explore_prepare, mutate: approve_repair_explore}]
      ordinary_execution_selected: [{target: exited, mutate: record_ordinary_exit}]

  explore_offer:
    owner: play
    checkpoint: after
    prompt: explore_or_exit
    "on":
      explore_approved: [{target: explore_prepare, mutate: approve_explore}]
      ordinary_execution_selected: [{target: exited, mutate: record_ordinary_exit}]

  explore_prepare:
    owner: play
    checkpoint: both
    requires: [consent.explore]
    entry: {action: prepare_exploration}
    "on":
      exploration_ready:
        - {guard: explore_is_approved, target: explore_route, mutate: record_exploration_context}
        - {target: blocked, mutate: record_missing_consent}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  explore_route:
    owner: play
    checkpoint: after
    entry: {action: select_modalities}
    "on":
      route_selected:
        - {guard: route_within_policy, target: explore_dispatch, mutate: record_route}
        - {target: modality_offer, mutate: record_widening_request}
      modality_widening_required: [{target: modality_offer, mutate: record_widening_request}]
      no_safe_route: [{target: blocked, mutate: record_no_route}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  explore_dispatch:
    owner: play
    checkpoint: after
    requires: [route.modalities, execution.owner, adapter_discovery.status]
    entry: {action: dispatch_route}
    "on":
      adapter_discovery_required: [{target: adapter_discover, mutate: record_route_dispatch}]
      direct_handoff_ready: [{target: explore_handoff, mutate: record_route_dispatch}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  adapter_discover:
    owner: rote-specialist
    checkpoint: both
    requires: [request.requested_outcome, route.modalities, execution.owner, adapter_discovery.query]
    entry: {action: discover_call_adapter}
    "on":
      adapter_ready: [{target: explore_handoff, mutate: record_adapter_discovery}]
      adapter_choices_ready: [{target: adapter_offer, mutate: record_adapter_discovery}]
      adapter_catalog_empty: [{target: explore_handoff, mutate: record_adapter_discovery}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  adapter_offer:
    owner: play
    checkpoint: after
    requires: [adapter_discovery.status, adapter_discovery.choices]
    prompt: choose_adapter_source
    "on":
      adapter_source_selected: [{target: explore_handoff, mutate: select_adapter_source}]
      adapter_catalog_rejected: [{target: explore_handoff, mutate: record_catalog_rejection}]

  modality_offer:
    owner: play
    checkpoint: after
    prompt: widen_modalities
    "on":
      modality_widening_approved: [{target: explore_route, mutate: widen_modality_policy}]
      modality_widening_declined: [{target: blocked, mutate: record_constraint_blocker}]

  explore_handoff:
    owner: play
    checkpoint: after
    requires: [execution.owner, route.modalities, consent.explore]
    entry: {action: prepare_specialist_handoff}
    "on":
      specialist_handoff_ready: [{target: explore_execute, mutate: record_specialist_handoff}]
      specialist_unavailable: [{target: blocked, mutate: record_specialist_unavailable}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  explore_execute:
    owner: rote-specialist
    checkpoint: both
    requires: [execution.owner, consent.explore, handoff.owner, handoff.available, handoff.packet, handoff.packet_sha256]
    entry: {action: execute_route}
    "on":
      outcome_ready: [{target: explore_receipt, mutate: record_specialist_response}]
      route_exhausted: [{target: explore_receipt, mutate: record_specialist_response}]
      confirmation_required: [{target: explore_receipt, mutate: record_specialist_response}]
      auth_repair_required: [{target: explore_receipt, mutate: record_specialist_response}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  explore_receipt:
    owner: play
    checkpoint: after
    requires: [execution.owner, handoff.packet, handoff.packet_sha256, handoff.receipt]
    entry: {action: validate_specialist_receipt}
    "on":
      specialist_outcome_ready: [{target: explore_verify, mutate: record_execution_evidence}]
      specialist_route_exhausted:
        - {guard: exploration_budget_remaining, target: explore_route, mutate: consume_attempt}
        - {target: blocked, mutate: record_exhaustion}
      specialist_confirmation_required: [{target: effect_offer, mutate: record_effect_confirmation}]
      specialist_auth_repair_required: [{target: auth_repair_offer, mutate: record_auth_repair_required}]
      specialist_receipt_invalid: [{target: blocked, mutate: record_invalid_specialist_receipt}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  effect_offer:
    owner: play
    checkpoint: after
    requires: [effect_policy.rote_confirmation]
    prompt: approve_effect_confirmation
    "on":
      effect_confirmation_approved: [{target: explore_handoff, mutate: approve_effect_confirmation}]
      effect_confirmation_declined: [{target: blocked, mutate: decline_effect_confirmation}]

  auth_repair_offer:
    owner: play
    checkpoint: after
    requires: [auth_repair.status, auth_repair.adapter_id, auth_repair.env_var, auth_repair.classified_rung, auth_repair.original_packet, auth_repair.original_packet_sha256]
    prompt: approve_auth_repair
    "on":
      auth_repair_approved: [{target: auth_repair_handoff, mutate: approve_auth_repair}]
      auth_repair_declined: [{target: blocked, mutate: decline_auth_repair}]

  auth_repair_handoff:
    owner: play
    checkpoint: after
    requires: [auth_repair.status, auth_repair.owner, auth_repair.original_packet, auth_repair.original_packet_sha256]
    entry: {action: prepare_auth_repair_handoff}
    "on":
      auth_repair_handoff_ready: [{target: auth_repair_execute, mutate: record_auth_repair_handoff}]
      auth_repair_specialist_unavailable: [{target: blocked, mutate: record_auth_repair_unavailable}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  auth_repair_execute:
    owner: rote-specialist
    checkpoint: both
    requires: [auth_repair.owner, auth_repair.packet, auth_repair.packet_sha256, auth_repair.original_packet_sha256]
    entry: {action: execute_auth_repair}
    "on":
      auth_repair_ready: [{target: auth_repair_receipt, mutate: record_auth_repair_response}]
      auth_repair_failed: [{target: auth_repair_receipt, mutate: record_auth_repair_response}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  auth_repair_receipt:
    owner: play
    checkpoint: after
    requires: [auth_repair.packet, auth_repair.packet_sha256, auth_repair.receipt]
    entry: {action: validate_auth_repair_receipt}
    "on":
      specialist_auth_repair_ready: [{target: explore_handoff, mutate: record_auth_repair_success}]
      specialist_auth_repair_failed: [{target: blocked, mutate: record_auth_repair_failure}]
      auth_repair_receipt_invalid: [{target: blocked, mutate: record_invalid_auth_repair_receipt}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  explore_verify:
    owner: play
    checkpoint: after
    entry: {action: verify_outcome}
    "on":
      outcome_verified: [{target: crystallize, mutate: record_verification}]
      outcome_not_verified:
        - {guard: exploration_budget_remaining, target: explore_route, mutate: consume_attempt}
        - {target: blocked, mutate: record_verification_failure}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  crystallize:
    owner: rote-specialist
    checkpoint: both
    requires: [evidence.verification]
    entry: {action: prepare_candidate}
    "on":
      candidate_ready:
        - {guard: outcome_is_verified, target: save_offer, mutate: record_candidate}
        - {target: blocked, mutate: record_verification_failure}
      not_reusable: [{target: completed, mutate: record_unpublished_result}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  save_offer:
    owner: play
    checkpoint: after
    prompt: private_public_or_skip
    "on":
      save_private: [{target: author_release, mutate: choose_private}]
      save_public: [{target: author_release, mutate: choose_public}]
      save_skipped: [{target: completed, mutate: record_save_skipped}]

  author_release:
    owner: rote-specialist
    checkpoint: both
    requires: [candidate.reference, consent.save]
    entry: {action: author_release}
    "on":
      flow_released: [{target: birth_capture, mutate: record_release}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  birth_capture:
    owner: play
    checkpoint: both
    requires: [candidate.released_flow, execution.workspace]
    entry: {action: capture_play_birth}
    "on":
      birth_captured:
        - {guard: save_choice_private, target: private_org, mutate: record_birth_capture}
        - {guard: save_choice_public, target: public_owner, mutate: record_birth_capture}
        - {target: blocked, mutate: record_missing_save_choice}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  private_org:
    owner: rote-specialist
    checkpoint: both
    entry: {action: ensure_private_org}
    "on":
      private_org_ready:
        - {guard: private_org_policy_satisfied, target: private_publish, mutate: record_private_org}
        - {target: blocked, mutate: record_private_org_violation}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  private_publish:
    owner: rote-specialist
    checkpoint: both
    entry: {action: publish_private}
    "on":
      play_published:
        - {guard: publication_is_private, target: birth_bind, mutate: record_publication}
        - {target: blocked, mutate: record_visibility_mismatch}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  public_owner:
    owner: rote-specialist
    checkpoint: both
    entry: {action: resolve_public_owner}
    "on":
      public_owner_ready: [{target: public_publish, mutate: record_public_owner}]
      public_owner_choice_required: [{target: public_owner_offer, mutate: record_public_owner_choices}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  public_owner_offer:
    owner: play
    checkpoint: after
    prompt: select_public_owner
    "on":
      public_owner_selected: [{target: public_publish, mutate: record_public_owner}]
      public_owner_declined: [{target: blocked, mutate: record_owner_blocker}]

  public_publish:
    owner: rote-specialist
    checkpoint: both
    entry: {action: publish_public}
    "on":
      play_published:
        - {guard: publication_is_public, target: birth_bind, mutate: record_publication}
        - {target: blocked, mutate: record_visibility_mismatch}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  birth_bind:
    owner: play
    checkpoint: both
    requires: [birth.sha256, publication.canonical_reference, play.version]
    entry: {action: bind_play_birth}
    "on":
      birth_bound: [{target: index, mutate: record_birth_binding}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  index:
    owner: play
    checkpoint: both
    requires: [publication.canonical_reference]
    entry: {action: index_playcard}
    "on":
      play_indexed:
        - {guard: exact_published_version_is_indexed, target: saved_inspect, mutate: record_index}
        - {target: blocked, mutate: record_index_mismatch}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  saved_inspect:
    owner: flow-runtime
    checkpoint: both
    requires: [publication.canonical_reference, publication.visibility, play.version]
    entry: {action: inspect_saved_play}
    "on":
      saved_play_inspected:
        - {guard: saved_public_inspection_matches_publication, target: publication_credentials, mutate: record_saved_inspection}
        - {guard: saved_inspection_matches_publication, target: saved_present, mutate: record_saved_inspection}
        - {target: blocked, mutate: record_saved_inspection_mismatch}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  publication_credentials:
    owner: flow-runtime
    checkpoint: both
    requires: [publication.canonical_reference, publication.uri, publication.visibility, play.version]
    entry: {action: inspect_publication_credentials}
    "on":
      associated_credentials_verified: [{target: publication_smoke, mutate: record_credential_contracts}]
      associated_credentials_invalid: [{target: blocked, mutate: record_credential_contract_failure}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  publication_smoke:
    owner: flow-runtime
    checkpoint: both
    requires: [publication.uri, publication.visibility, play.version, request.parameters, consent.save, publication_validation.credential_status, publication_validation.credential_contract_sha256]
    entry: {action: smoke_publication}
    "on":
      public_smoke_verified: [{target: saved_present, mutate: record_public_smoke}]
      public_smoke_failed: [{target: blocked, mutate: record_public_smoke_failure}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  saved_present:
    owner: play
    checkpoint: after
    requires: [publication.canonical_reference, publication.visibility, publication.owner, publication.title, publication.description, publication.content_hash, publication.inspect_ref, publication_validation.credential_status, publication_validation.smoke_status, play.version]
    entry: {action: present_saved_play}
    "on":
      saved_play_presented: [{target: completed, mutate: record_saved_presentation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  receipt: {owner: play}
  completed: {owner: play}
  exited: {owner: play}
  blocked: {owner: play}
