schema: play.prompts/v1

prompts:
  choose_login_provider:
    question: Sign in to Rote to continue this Play request. Which identity provider would you like to use?
    selection: single
    choices:
      - {id: google, label: Continue with Google, description: Opens the Rote Google OAuth flow in your browser., event: onboarding_google_login_selected, recommended: true}
      - {id: github, label: Continue with GitHub, description: Opens the Rote GitHub OAuth flow in your browser., event: onboarding_github_login_selected}
      - {id: defer, label: Not now, description: Stop without signing in; your original request is not executed., event: onboarding_login_deferred}
    events:
      onboarding_google_login_selected: [prompt_version, selected_at]
      onboarding_github_login_selected: [prompt_version, selected_at]
      onboarding_login_deferred: [prompt_version, selected_at]

  welcome_play_request:
    question: How are you, {onboarding.email_handle}? What can I help you with?
    template_fields: [onboarding.email_handle]
    selection: text
    input: {id: request, label: What you need, event: welcome_request_described}
    events:
      welcome_request_described: [prompt_version, selected_at, request.original]

  choose_first_use_path:
    question: What would you like to do first?
    selection: single
    choices:
      - {id: hello, label: Run Hello, description: "Low-risk proof: public data, no account, no credentials, and no declared writes.", event: onboarding_starter_selected, recommended: true}
      - {id: team, label: Create team space, description: "Claim a team handle, then invite colleagues to review and use shared Plays.", event: onboarding_team_selected}
      - {id: goal, label: Tell me your goal, description: Find an existing Play or work out a checked method together., event: onboarding_goal_selected}
      - {id: useful, label: Browse useful Plays, description: See available Plays before choosing whether to inspect one., event: onboarding_awareness_selected}
      - {id: done, label: Not now, description: Finish the introduction without inspecting or running anything., event: onboarding_dismissed}
    events:
      onboarding_starter_selected: [prompt_version, selected_at, onboarding.starter_reference]
      onboarding_team_selected: [prompt_version, selected_at]
      onboarding_goal_selected: [prompt_version, selected_at]
      onboarding_awareness_selected: [prompt_version, selected_at]
      onboarding_dismissed: [prompt_version, selected_at]

  describe_onboarding_need:
    question: What result would you like to get?
    selection: text
    input: {id: request, label: What you need, event: onboarding_need_described}
    events:
      onboarding_need_described: [prompt_version, selected_at, request.original]

  choose_onboarding_next:
    question: What would you like to do next?
    selection: single
    choices:
      - {id: useful, label: Run another Play, description: Choose from a random sample of 10 public Plays and inspect the method before approving it., event: onboarding_awareness_selected, recommended: true}
      - {id: goal, label: Create your own, description: Start with a useful outcome; Play searches first and, when exploration is needed, capture begins before the work so a verified method can be saved., event: onboarding_goal_selected}
      - {id: team, label: Create team space, description: Claim a team handle and invite colleagues to review and use Plays together., event: onboarding_team_selected}
      - {id: done, label: Finish, description: Keep the verified receipt and stop here., event: onboarding_finished}
    events:
      onboarding_goal_selected: [prompt_version, selected_at]
      onboarding_team_selected: [prompt_version, selected_at]
      onboarding_awareness_selected: [prompt_version, selected_at]
      onboarding_finished: [prompt_version, selected_at, receipt_ref]

  confirm_onboarding_result:
    question: Can you see the complete Play result above?
    selection: single
    choices:
      - {id: continue, label: "Yes, continue", description: Continue onboarding only after the complete result is visible., event: onboarding_result_confirmed, recommended: true}
      - {id: replay, label: Show result again, description: Replay the unchanged result by itself before showing any next action., event: onboarding_result_replay_requested}
      - {id: done, label: Stop here, description: Keep the verified receipt and stop without continuing onboarding., event: onboarding_result_finished}
    events:
      onboarding_result_confirmed: [prompt_version, selected_at]
      onboarding_result_replay_requested: [prompt_version, selected_at]
      onboarding_result_finished: [prompt_version, selected_at, receipt_ref]

  describe_team_handle:
    question: What lowercase team handle should colleagues recognize?
    selection: text
    input: {id: team_handle, label: Team handle, event: team_handle_described}
    events:
      team_handle_described: [prompt_version, selected_at, team.slug]

  choose_team_invite:
    question: Would you like to invite a colleague to review and use Plays in this team?
    selection: single
    choices:
      - {id: invite, label: Invite colleague, description: Invite one colleague as a developer; you can add more after each invite., event: team_invite_selected, recommended: true}
      - {id: done, label: Continue, description: Finish team onboarding for now; members can be invited later., event: team_onboarding_finished}
    events:
      team_invite_selected: [prompt_version, selected_at, team.slug, team.invite_role]
      team_onboarding_finished: [prompt_version, selected_at, team.slug]

  describe_team_invite:
    question: Which colleague should join this team as a developer?
    selection: text
    input: {id: colleague_email, label: Colleague email, event: team_invite_described}
    events:
      team_invite_described: [prompt_version, selected_at, team.slug, team.invite_email, team.invite_role]

  select_awareness_play:
    question: Which Play would you like to inspect?
    selection: single
    choices_from:
      context: awareness.play_choices
      id_field: reference
      label_field: label
      description_field: description
      value_source_field: reference
      value_field: match.reference
      event: awareness_play_selected
    choices:
      - {id: search, label: Find by outcome, description: Describe what you need and search every authorized Play., event: awareness_search_selected}
      - {id: create, label: Create your own, description: Begin with a useful outcome and capture the trajectory before exploration starts., event: awareness_create_selected}
      - {id: done, label: Not now, description: Close discovery without inspecting or running anything., event: awareness_dismissed}
    events:
      awareness_play_selected: [prompt_version, selected_at, match.reference, request.original, request.parameters]
      awareness_search_selected: [prompt_version, selected_at]
      awareness_create_selected: [prompt_version, selected_at]
      awareness_dismissed: [prompt_version, selected_at]

  describe_awareness_need:
    question: What outcome would you like a Play to handle?
    selection: text
    input: {id: requested_outcome, label: Desired outcome, event: awareness_need_described}
    events:
      awareness_need_described: [prompt_version, selected_at, request.intent, request.requested_outcome, modality_policy]

  describe_creator_need:
    question: What outcome should the new Play accomplish?
    selection: text
    input: {id: requested_outcome, label: Desired outcome, event: creator_need_described}
    events:
      creator_need_described: [prompt_version, selected_at, request.intent, request.requested_outcome, creator.intent, modality_policy]

  choose_creator_path:
    question: A related Play already exists. How should I proceed?
    selection: single
    choices:
      - {id: use, label: Inspect existing, description: Inspect the adequate Play, then review setup and effects before deciding whether to run it., event: creator_use_selected, recommended: true}
      - {id: adapt, label: Adapt existing, description: Use the related Play as evidence while exploring a tailored result., event: creator_adapt_selected}
      - {id: create, label: Create distinct, description: Explore a separate Play for this outcome., event: creator_create_selected}
    events:
      creator_use_selected: [prompt_version, selected_at, match.reference, request.parameters]
      creator_adapt_selected: [prompt_version, selected_at, match.reference]
      creator_create_selected: [prompt_version, selected_at]

  choose_search_result:
    question: Which matching Play should I inspect before asking whether to pull and run it?
    selection: single
    choices_from:
      context: search.play_choices
      id_field: reference
      label_field: label
      description_field: description
      value_source_field: reference
      value_field: match.reference
      event: search_play_selected
    choices:
      - {id: done, label: Not now, description: Keep the search results without inspecting or running a Play., event: search_dismissed}
    events:
      search_play_selected: [prompt_version, selected_at, match.reference, request.parameters]
      search_dismissed: [prompt_version, selected_at]

  choose_exploration_recovery:
    question: "⚠ Route blocked: {exploration.route_failure} Choose another exploration path, or use `direct: <task>` for a one-turn side-step and return with `continue exploration`?"
    template_fields: [exploration.route_failure]
    selection: single
    choices:
      - {id: retry, label: Try another tool, description: "Return to tool discovery, show the alternatives, and wait for my selection before continuing.", event: exploration_retry_selected, recommended: true}
      - {id: stop, label: Stop exploration, description: "Keep the evidence recorded so far but do not save or publish a Play.", event: exploration_stopped}
    events:
      exploration_retry_selected: [prompt_version, selected_at]
      exploration_stopped: [prompt_version, selected_at]

  describe_exploration_goal:
    question: "✓ {exploration.provider} is connected. What useful outcome would you like to explore with it?"
    template_fields: [exploration.provider]
    selection: text
    input: {id: requested_outcome, label: Useful outcome, event: exploration_goal_supplied}
    events:
      exploration_goal_supplied: [prompt_version, selected_at, request.requested_outcome]

  approve_play_run:
    question: Pull or replace this remote Play as disclosed, then run it with the displayed parameters and effects?
    selection: single
    choices:
      - {id: run, label: Pull and run, description: "Authorize rote to install or replace the exact remote Play and dependencies, then execute it with the displayed parameters.", event: play_run_approved}
      - {id: cancel, label: Not now, description: "Stop without installing, replacing, authenticating, or running anything.", event: play_run_declined}
    events:
      play_run_approved: [prompt_version, selected_at, inspection.exact_reference, inspection.disclosure_sha256, request.parameters]
      play_run_declined: [prompt_version, selected_at]

  supply_play_parameter:
    question: "Expected: {parameter_input.description}\n\nWhat value should I use for {parameter_input.label}?"
    template_fields: [parameter_input.label, parameter_input.description]
    selection: text
    input: {id: value, label: Parameter value, event: play_parameter_supplied}
    events:
      play_parameter_supplied: [prompt_version, selected_at, parameter_input.name, parameter_input.value]

  approve_authentication:
    question: "{authentication.adapter_id} authentication blocked this run ({authentication.classified_rung}). Play can verify the adapter's current credential state, or follow its declared protocol: local token setup for static credentials and in-place browser reauthorization for OAuth or DCR. Credentials are never exposed in chat. What should Play do?"
    template_fields: [authentication.adapter_id, authentication.classified_rung]
    selection: single
    choices:
      - {id: verify, label: Verify current auth and retry, description: "Verify the declared token inventory for static credentials or fresh adapter health for OAuth, then retry the exact approved Play only when authentication is healthy.", event: authentication_verification_requested, recommended: true}
      - {id: authenticate, label: Continue authentication, description: "Use the adapter's declared path: verified local token setup for static credentials or in-place Rote reauthorization for OAuth and DCR without rebuilding the adapter.", event: authentication_approved}
      - {id: stop, label: Not now, description: Stop without changing authentication or retrying the Play., event: authentication_declined}
    events:
      authentication_verification_requested: [prompt_version, selected_at, authentication.adapter_id, authentication.env_var, authentication.classified_rung, authentication.distinguishing_error, authentication.original_packet_sha256]
      authentication_approved: [prompt_version, selected_at, authentication.adapter_id, authentication.env_var, authentication.classified_rung, authentication.distinguishing_error, authentication.original_packet_sha256]
      authentication_declined: [prompt_version, selected_at, authentication.adapter_id, authentication.env_var, authentication.classified_rung, authentication.original_packet_sha256]

  private_public_or_skip:
    question: "💾 SAVE — {publication.owner_summary} How should I preserve this verified exploration as a Play?"
    template_fields: [publication.owner_summary]
    selection: single
    choices:
      - {id: private, label: Team, description: "Publish a private URI for authorized teammates, offer member invites after verification, and provide a paste-ready team message.", event: save_private, recommended: true}
      - {id: public, label: Community, description: "Teach the Community what the team learned, verify the exact public Play, then produce paste-ready X and LinkedIn explanations.", event: save_public}
      - {id: skip, label: Skip, description: Keep the verified result but do not publish or index a Play., event: save_skipped}
    events:
      save_private: [prompt_version, selected_at]
      save_public: [prompt_version, selected_at, publication.owner_resolution, publication.owner]
      save_skipped: [prompt_version, selected_at]

  select_public_owner:
    question: "🏷 OWNER — {publication.owner_summary} Which public namespace should own this Play?"
    template_fields: [publication.owner_summary]
    selection: single
    choices_from:
      context: publication.owner_choices
      id_field: id
      label_field: display_name
      description_field: ownership_description
      value_source_field: owner
      value_field: publication.owner
      recommended_field: recommended
      event: public_owner_selected
    choices:
      - {id: cancel, label: Cancel publication, description: Stop without selecting a public owner., event: public_owner_declined}
    events:
      public_owner_selected: [prompt_version, selected_at, publication.owner]
      public_owner_declined: [prompt_version, selected_at]

  choose_uri_setup:
    question: Set up Rote now and run this Play?
    selection: single
    choices:
      - {id: setup, label: Set up and run, description: "Install Rote with the guided rote-setup skill, sign in, then inspect and approve this exact Play before anything runs.", event: onboarding_uri_setup_selected, recommended: true}
      - {id: done, label: Not now, description: Keep the Play card without installing or running anything., event: onboarding_card_dismissed}
    events:
      onboarding_uri_setup_selected: [prompt_version, selected_at]
      onboarding_card_dismissed: [prompt_version, selected_at]

  select_management_views:
    question: Which Play inventory views would you like to see?
    selection: multiple
    minimum_selected: 1
    choices:
      - {id: org_summary, label: Organization summary, description: Show each authorized organization with member and private/public Play counts., event: management_views_selected, recommended: true}
      - {id: plays_by_org, label: Plays by organization, description: Group every authorized private and public Play by organization., event: management_views_selected}
    events:
      management_views_selected: [prompt_version, selected_at, management.views]
