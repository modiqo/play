schema: play.actions/v1

owners: [play, rote-specialist, flow-runtime]
effects: [none, read, local-write, external-write, mixed]
specialist_owners: [rote-using-adapters, rote-shell, rote-browse, rote-workspace]
adapter_specialist_owners: [rote-adapter-create, rote-adapter-config]
route_owners:
  call: rote-using-adapters
  shell: rote-shell
  drive: rote-browse
  combined: rote-workspace

guards:
  - search_is_complete
  - search_only_requested
  - match_satisfies_constraints
  - explore_is_approved
  - route_within_policy
  - exploration_budget_remaining
  - outcome_is_verified
  - save_choice_private
  - save_choice_public
  - private_org_policy_satisfied
  - publication_is_private
  - publication_is_public
  - exact_published_version_is_indexed
  - saved_inspection_matches_publication

mutations:
  - set_request_contract
  - set_search_request
  - set_awareness_request
  - set_creator_request
  - record_awareness_digest
  - record_awareness_presentation
  - enter_awareness_use
  - record_awareness_search_choice
  - record_awareness_create_choice
  - record_awareness_dismissal
  - set_awareness_search
  - set_creator_need
  - record_creator_search
  - record_creator_match
  - approve_creator_explore
  - approve_adapt_explore
  - enter_creator_use
  - record_non_outcome_exit
  - record_explicit_exit
  - set_management_request
  - set_birth_request
  - record_management_choices
  - choose_management_views
  - record_management_inventory
  - record_management_presentation
  - record_birth_presentation
  - record_blocker
  - record_search_results
  - record_search_presentation
  - enter_search_use
  - record_search_dismissal
  - record_incomplete_search
  - enter_use
  - downgrade_inadequate_match
  - record_partial_match
  - record_uncertain_match
  - record_no_match
  - record_failed_receipt
  - enter_direct_use
  - record_play_inspection
  - record_unrunnable_inspection
  - recover_unresolved_reference
  - approve_inspected_run
  - record_run_dismissal
  - record_controller_run
  - record_formatted_output
  - record_incomplete_output
  - record_verification
  - attach_receipt
  - approve_repair_explore
  - record_ordinary_exit
  - approve_explore
  - record_exploration_context
  - record_missing_consent
  - record_route
  - record_route_dispatch
  - record_adapter_discovery
  - select_adapter_source
  - record_catalog_rejection
  - record_specialist_handoff
  - record_specialist_unavailable
  - record_specialist_response
  - record_invalid_specialist_receipt
  - record_effect_confirmation
  - approve_effect_confirmation
  - decline_effect_confirmation
  - record_auth_repair_required
  - approve_auth_repair
  - decline_auth_repair
  - record_auth_repair_handoff
  - record_auth_repair_unavailable
  - record_auth_repair_response
  - record_auth_repair_success
  - record_auth_repair_failure
  - record_invalid_auth_repair_receipt
  - record_widening_request
  - record_no_route
  - widen_modality_policy
  - record_constraint_blocker
  - record_execution_evidence
  - consume_attempt
  - record_exhaustion
  - record_verification_failure
  - record_candidate
  - record_unpublished_result
  - choose_private
  - choose_public
  - record_save_skipped
  - record_release
  - record_missing_save_choice
  - record_birth_capture
  - record_birth_binding
  - record_private_org
  - record_private_org_violation
  - record_publication
  - record_visibility_mismatch
  - record_public_owner
  - record_public_owner_choices
  - record_owner_blocker
  - record_index
  - record_index_mismatch
  - record_saved_inspection
  - record_saved_inspection_mismatch
  - record_saved_presentation

actions:
  qualify_request:
    kind: evaluator
    owner: play
    effect: none
    input_required: [request.original]
    events:
      outcome_request: [request.intent, request.requested_outcome, modality_policy]
      exact_play_request: [request.intent, request.requested_outcome, request.parameters, match.reference, modality_policy]
      play_search_request: [request.intent]
      play_awareness_request: [request.intent, awareness.window_days]
      play_creation_request: [request.intent, request.requested_outcome, creator.intent, modality_policy]
      play_management_request: [request.intent, management.views]
      play_management_choice_required: [request.intent]
      play_birth_request: [request.intent, birth.selector]
      conversation: [reason]
      play_excluded: [reason]

  collect_awareness_digest:
    kind: deterministic
    owner: play
    effect: local-write
    input_required: [awareness.window_days]
    command: scripts/bin/play-digest --remember --days <awareness.window_days> --json
    events:
      awareness_ready: [awareness.complete, awareness.digest_ref, awareness.play_choices, evidence_refs]
      awareness_unchanged: [awareness.complete, awareness.digest_ref, awareness.play_choices, evidence_refs]

  present_awareness_digest:
    kind: deterministic
    owner: play
    effect: none
    input_required: [awareness.complete, awareness.digest_ref, awareness.play_choices]
    events:
      awareness_presented: [awareness.digest_ref, awareness.play_choices]

  search_creator_plays:
    kind: deterministic
    owner: play
    effect: read
    input_required: [request.intent, request.requested_outcome, modality_policy]
    command: scripts/bin/play-search <request.intent> --json
    events:
      creator_search_ready: [search.complete, search.query, search.sources, search.result_refs, search.results]

  classify_creator_options:
    kind: evaluator
    owner: play
    effect: none
    input_required: [request.requested_outcome, search.result_refs, modality_policy]
    events:
      creator_match_ready: [match.reference, match.covered, match.uncovered, confidence]
      creator_no_match: [match.covered, match.uncovered, confidence]

  list_play_management:
    kind: delegated
    owner: rote-specialist
    effect: read
    input_required: [management.views]
    events:
      management_inventory_ready: [management.org_summary_ref, management.plays_by_org_ref, evidence_refs]

  present_play_management:
    kind: deterministic
    owner: play
    effect: none
    input_required: [management.views, management.org_summary_ref, management.plays_by_org_ref]
    events:
      management_presented: [management.views, management.org_summary_ref, management.plays_by_org_ref]

  show_play_birth:
    kind: deterministic
    owner: play
    effect: read
    input_required: [birth.selector]
    command: scripts/bin/play-birth show <birth.selector> --json
    events:
      birth_ready: [birth.sha256, birth.flow_fingerprint, birth.object_ref, birth.exact_reference, birth.binding_ref]

  search_authorized_plays:
    kind: deterministic
    owner: play
    effect: read
    input_required: [request.intent, modality_policy]
    command: scripts/bin/play-search <request.intent> --json
    command_policy:
      - Normalize once, then search local and authorized registry indexes concurrently.
      - Deduplicate aliases and versions by canonical Play reference and return URI and run hints.
      - Use registry or Flow search only because rote play currently exposes no search command.
      - If rote play gains search support, prefer it and retire the lower-level gap route.
    events:
      search_ready: [search.complete, search.query, search.sources, search.result_refs, search.results, search.play_choices]

  present_search_results:
    kind: deterministic
    owner: play
    effect: none
    input_required: [search.complete, search.query, search.sources, search.results]
    command_policy:
      - State whether each registry Play was found locally or is expected to need a pull/install.
      - Use search.play_choices from the reusable search output; local-only Flow gaps remain informational.
      - A selection identifies a Play for read-only inspection and never authorizes execution.
    events:
      search_presented: [search.query, search.sources, search.result_refs, search.results, search.play_choices]

  classify_adequacy:
    kind: evaluator
    owner: play
    effect: none
    input_required: [request.requested_outcome, search.result_refs, modality_policy]
    events:
      full_match: [match.reference, match.covered, match.uncovered, confidence]
      partial_match: [match.reference, match.covered, match.uncovered, confidence]
      uncertain_match: [match.reference, match.covered, match.uncovered, confidence]
      no_match: [match.covered, match.uncovered, confidence]

  inspect_registry_play:
    kind: deterministic
    owner: play
    effect: read
    input_required: [match.reference, request.parameters]
    command: scripts/bin/play-inspect <match.reference> --json
    command_policy:
      - Invoke first-class rote play inspect through the reusable wrapper; never pull, install, repair, authenticate, or run during this state.
      - Present the exact version, purpose, parameters, declared operations, dependencies, credentials, local convergence, blockers, and declared write permissions.
      - When generic adapter operations do not prove read/write semantics, label the effect unknown rather than claiming read-only execution.
      - An explicit run request selects what to inspect; it is not approval to execute after disclosure.
      - If and only if first-class inspection reports play-not-found, return play_reference_unresolved so the controller can search by the requested name; other inspection failures block.
    events:
      play_inspected: [inspection.complete, inspection.exact_reference, inspection.description, inspection.local_change, inspection.dependencies, inspection.operations, inspection.effects, inspection.disclosure_sha256]
      play_not_runnable: [inspection.complete, inspection.exact_reference, inspection.description, inspection.blockers, inspection.dependencies, inspection.operations, inspection.effects, inspection.disclosure_sha256]
      play_reference_unresolved: [reason]

  run_registry_play:
    kind: deterministic
    owner: flow-runtime
    effect: mixed
    input_required: [match.reference, inspection.exact_reference, inspection.disclosure_sha256, request.original, request.parameters, effect_policy, output_policy]
    command: rote play run <inspection.exact_reference> <approved-parameters> --yes
    command_policy:
      - Use --yes only after approve_play_run returns play_run_approved for this exact inspection digest, reference, and displayed parameters.
      - A run command in the original request, an Awareness selection, or a search selection never substitutes for post-inspection approval.
      - If the inspection changes or parameters change, discard approval and return to use_inspect.
      - Never replace this command with registry pull plus flow run, even when the Play is already local.
      - Never request summary output. Preserve the complete primary payload, response and artifact references, effects, and any full-output reference returned by Rote.
      - Prefer Rote's human presentation for steps-with-presentation Plays; accept JSON or structured responses only when they retain the full primary result.
      - A compact Play summary cannot prove full detail and must not emit play_run_ready.
    events:
      play_run_ready: [play.version, resolution.local_state, resolution.pull_performed, result_ref, response_refs, artifact_refs, effects, output.mode, output.detail, output.source, output.format, output.primary, output.manifest, output.truncated, output.full_output_ref]
      play_drifted: [reason, evidence_refs]

  format_run_output:
    kind: deterministic
    owner: play
    effect: none
    input_required: [match.reference, play.version, output_policy.max_inline_bytes, output.mode, output.detail, output.source, output.format, output.primary, output.manifest, output.truncated, output.full_output_ref]
    command: scripts/bin/play-run-output --stdin --json
    command_policy:
      - Preserve Markdown exactly, render flat JSON records as a Markdown table, and pretty-print other JSON or text without summarizing it.
      - Reject summary-only or compact-summary sources; verification cannot begin without a complete primary result.
      - If inline output exceeds output_policy.max_inline_bytes, require a full_output_ref and render a bounded preview that links to the complete result.
      - Record formatting latency without including it in the presentation digest.
    events:
      detailed_output_ready: [output.presentation_markdown, output.presentation_sha256, output.inline_bytes, output.primary_bytes, output.format_ns, output.truncated, output.full_output_ref]

  verify_outcome:
    kind: evaluator
    owner: play
    effect: none
    input_required: [request.requested_outcome, evidence]
    events_by_state:
      use_verify:
        outcome_verified: [postconditions, evidence_refs]
        outcome_not_verified: [failed_postconditions, evidence_refs]
        play_drifted: [reason, evidence_refs]
      explore_verify:
        outcome_verified: [postconditions, evidence_refs]
        outcome_not_verified: [failed_postconditions, evidence_refs]

  build_receipt:
    kind: deterministic
    owner: play
    effect: none
    input_required: [match.reference, evidence.verification, output.presentation_markdown, output.presentation_sha256]
    events:
      receipt_ready: [receipt_ref, output.presentation_markdown, output.presentation_sha256]

  prepare_exploration:
    kind: deterministic
    owner: play
    effect: local-write
    input_required: [consent.explore, request.requested_outcome]
    events:
      exploration_ready: [execution.workspace, execution.budget, evidence.baseline]

  select_modalities:
    kind: evaluator
    owner: play
    effect: none
    input_required: [request.requested_outcome, modality_policy, judge_policy]
    command_policy:
      - When selecting CALL, derive adapter_discovery.query from the provider or API named in the request; keep it concise enough for rote adapter catalog search.
      - For a non-CALL route, set adapter_discovery.query to null.
    events:
      route_selected: [execution.owner, route.modalities, justification, adapter_discovery.query]
      modality_widening_required: [requested_modalities, reason]
      no_safe_route: [reason, checked_capabilities]

  dispatch_route:
    kind: deterministic
    owner: play
    effect: none
    input_required: [route.modalities, execution.owner, adapter_discovery.status]
    command_policy:
      - Emit adapter_discovery_required whenever route.modalities contains CALL, including combined routes.
      - Emit direct_handoff_ready only for routes containing SHELL and/or DRIVE without CALL.
      - Never infer adapter availability in this action; CALL must pass through the declared discovery state.
    events:
      adapter_discovery_required: [route.modalities, execution.owner]
      direct_handoff_ready: [route.modalities, execution.owner]

  discover_call_adapter:
    kind: delegated
    owner: rote-specialist
    effect: read
    input_required: [request.requested_outcome, route.modalities, execution.owner, adapter_discovery.query]
    command_policy:
      - Invoke rote-adapter-create for discovery only; this action must not create, configure, authenticate, or execute an adapter.
      - Search installed adapters first with rote adapter list --json and inspect every plausible match with rote adapter info <id>.
      - Only when no installed adapter adequately covers the requested capability, always run rote adapter catalog search <adapter_discovery.query> --json.
      - When catalog search returns one or more matches, return every match as adapter_discovery.choices and emit adapter_choices_ready; never silently select one or continue to provider documentation.
      - Preserve REST/OpenAPI, GraphQL, and MCP entries for the same provider as distinct choices with substrate, authentication shape, health/install impact, and next-command details when available.
      - Emit adapter_catalog_empty only after a successful zero-result catalog search. Provider documentation or a supplied specification may be considered later, never before this evidence exists.
      - A unique adequate installed adapter may emit adapter_ready. Multiple plausible installed adapters must emit adapter_choices_ready.
    events:
      adapter_ready: [adapter_discovery.status, adapter_discovery.searched_sources, adapter_discovery.choices, adapter_discovery.selected_id, adapter_discovery.evidence_refs]
      adapter_choices_ready: [adapter_discovery.status, adapter_discovery.searched_sources, adapter_discovery.choices, adapter_discovery.evidence_refs]
      adapter_catalog_empty: [adapter_discovery.status, adapter_discovery.searched_sources, adapter_discovery.choices, adapter_discovery.evidence_refs]

  prepare_specialist_handoff:
    kind: deterministic
    owner: play
    effect: none
    input_required: [run_id, request.requested_outcome, route.modalities, execution.owner, execution.workspace, execution.idempotency_key, effect_policy, adapter_discovery]
    command: scripts/bin/play-handoff prepare --stdin --json
    command_policy:
      - Enumerate only rote-* skills exposed as callable by the current harness; installed files or raw MCP tools do not count as available specialists.
      - CALL requires rote-using-adapters, SHELL requires rote-shell, DRIVE requires rote-browse, and combined routes require rote-workspace.
      - A CALL packet requires adapter convergence from the bound discovery record: reuse its selected installed adapter, use its selected catalog entry, or ask rote-adapter-create to continue from proven catalog exhaustion into provided-spec/provider-document discovery.
      - Bind the typed adapter_discovery record into every CALL packet. It must prove installed inventory and either a selected catalog entry, explicit catalog rejection, or a zero-result catalog search before provided-spec or provider-document discovery.
      - Existing-adapter authentication repair is never performed inside packet preparation; it requires a typed auth_repair_required receipt, Play approval, and the separate rote-adapter-config repair handoff.
      - Provider schemas, endpoint metadata, documentation, and MCP server cards are discovery evidence only. They never authorize direct capability execution outside the Rote adapter.
      - When effect_policy.rote_confirmation is approved, invalidate the prior packet and bind the new packet to the exact Rote tool, impact, token, workspace, and evidence so the same specialist resumes only that guarded call.
      - If the exact owner is unavailable, emit specialist_unavailable and block; never substitute a direct MCP, app, shell, or browser tool.
    events:
      specialist_handoff_ready: [handoff.owner, handoff.available, handoff.packet, handoff.packet_sha256, handoff.expected_events]
      specialist_unavailable: [handoff.owner, handoff.available, handoff.blocked_reason, available_owners]

  execute_route:
    kind: delegated
    owner: rote-specialist
    effect: mixed
    input_required: [execution.owner, consent.explore, route.modalities, handoff.owner, handoff.available, handoff.packet, handoff.packet_sha256]
    command_policy:
      - Invoke the selected rote-* skill through the harness skill mechanism with the exact play.handoff/v1 packet.
      - For CALL, accept only the packet-bound adapter_discovery result. Never repeat or skip its installed-then-catalog sequence, silently select an unchosen match, or replace it with model memory.
      - Reuse the selected installed adapter. For a selected catalog entry or proven catalog exhaustion/rejection, delegate adapter creation to rote-adapter-create, which must determine OpenAPI, GraphQL, or MCP before using the matching Rote creation command.
      - Complete initial authentication for a newly created adapter through rote-adapter-create, including required human approval and masked secret entry, before invoking rote-using-adapters.
      - When a recoverable auth failure is classified, emit auth_repair_required with the adapter id, environment variable, opaque classified rung, distinguishing error, and evidence; do not collapse it into route_exhausted.
      - If adapter creation, type detection, non-recoverable authentication, or adapter execution cannot complete, emit route_exhausted with evidence; never fall back to a raw provider or MCP call.
      - Treat probe readOnlyHint and destructiveHint values as discovery metadata only; never emit confirmation_required, route_exhausted, or action_blocked solely from those hints.
      - Attempt a matching operation through Rote. Emit confirmation_required only when the Rote call itself returns confirmation_required, preserving its exact tool, impact, token, workspace, and evidence.
      - When the packet carries an approved Rote confirmation, resume the same workspace and retry only the guarded call with --confirm <token>; do not probe again or broaden the operation.
      - During explore_execute, Play must not call MCP, app, shell, or browser tools directly; tool access never substitutes for the selected specialist.
      - If the selected specialist cannot be invoked, emit action_blocked. Never fabricate a specialist event or receipt.
    events:
      outcome_ready: [handoff.receipt, result_ref, response_refs, artifact_refs, modalities_used, effects, route_provenance]
      route_exhausted: [handoff.receipt, reason, evidence_refs]
      confirmation_required: [handoff.receipt, effect_confirmation]
      auth_repair_required: [handoff.receipt, auth_repair]

  validate_specialist_receipt:
    kind: deterministic
    owner: play
    effect: none
    input_required: [run_id, execution.owner, handoff.packet, handoff.packet_sha256, handoff.receipt]
    command: scripts/bin/play-handoff verify --stdin --json
    command_policy:
      - Accept only play.handoff-receipt/v1 from the packet owner with matching run, state, action, packet SHA, declared event, complete payload, and skill executor identity.
      - A successful CALL receipt must include adapter provenance: adapter id, detected OpenAPI/GraphQL/MCP substrate and evidence, reused/created status, Rote creation owner when applicable, verified/completed auth owner, and direct_tool_execution=false.
      - Accept confirmation_required only when its typed receipt proves source=rote_confirmation_required and carries a non-empty tool, impact, token, workspace, and evidence.
      - Accept auth_repair_required only when its typed receipt proves source=rote_auth_repair_required, recoverable=true, and carries a non-empty adapter id, environment variable, classified rung, distinguishing error, and evidence.
      - A raw MCP, app, shell, browser, or prose result has no valid specialist receipt and must emit specialist_receipt_invalid.
    events:
      specialist_outcome_ready: [handoff.receipt_ref, handoff.receipt_valid, result_ref, response_refs, artifact_refs, modalities_used, effects, route_provenance]
      specialist_route_exhausted: [handoff.receipt_ref, handoff.receipt_valid, reason, evidence_refs]
      specialist_confirmation_required: [handoff.receipt_ref, handoff.receipt_valid, effect_confirmation]
      specialist_auth_repair_required: [handoff.receipt_ref, handoff.receipt_valid, auth_repair]
      specialist_receipt_invalid: [handoff.receipt_valid, handoff.blocked_reason, evidence_refs]

  prepare_auth_repair_handoff:
    kind: deterministic
    owner: play
    effect: none
    input_required: [run_id, request.requested_outcome, auth_repair.status, auth_repair.owner, auth_repair.adapter_id, auth_repair.env_var, auth_repair.classified_rung, auth_repair.distinguishing_error, auth_repair.original_packet, auth_repair.original_packet_sha256, execution.idempotency_key]
    command: scripts/bin/play-handoff prepare-auth-repair --stdin --json
    command_policy:
      - Require rote-adapter-config to be callable; it is the only permitted auth-repair owner and never becomes a CALL execution owner.
      - Bind the repair packet to the validated original CALL packet and its SHA, preserving its requested outcome and idempotency key.
      - Treat classified_rung as opaque Rote-owned classification; Play must not reinterpret or execute ladder mechanics.
      - Never request, accept, or store raw credentials in Play context or the handoff packet.
    events:
      auth_repair_handoff_ready: [auth_repair.owner, auth_repair.packet, auth_repair.packet_sha256]
      auth_repair_specialist_unavailable: [auth_repair.owner, auth_repair.blocked_reason, available_owners]

  execute_auth_repair:
    kind: delegated
    owner: rote-specialist
    effect: mixed
    input_required: [auth_repair.owner, auth_repair.packet, auth_repair.packet_sha256, auth_repair.original_packet_sha256]
    command_policy:
      - Invoke only rote-adapter-config with the exact play.auth-repair-handoff/v1 packet.
      - Let rote-adapter-config own classification checks, repair commands, OAuth and secret-entry gates, and ladder termination.
      - Return one typed play.auth-repair-receipt/v1 receipt; never call the provider, adapter, or original operation from the repair state.
    events:
      auth_repair_ready: [auth_repair.receipt, auth_repair]
      auth_repair_failed: [auth_repair.receipt, reason, evidence_refs]

  validate_auth_repair_receipt:
    kind: deterministic
    owner: play
    effect: none
    input_required: [run_id, auth_repair.packet, auth_repair.packet_sha256, auth_repair.receipt]
    command: scripts/bin/play-handoff verify-auth-repair --stdin --json
    command_policy:
      - Accept only a matching rote-adapter-config skill receipt for the exact repair packet, run, state, action, owner, and packet SHA.
      - On success require the same adapter id, environment variable, and classified rung as the repair request plus a non-empty repair action and evidence.
      - On success preserve the original operation inputs and idempotency key, then prepare a fresh execution packet carrying the validated repair receipt reference.
      - Never treat repair success as outcome success; the original CALL must still execute and verify.
    events:
      specialist_auth_repair_ready: [auth_repair.receipt_ref, auth_repair.receipt_valid, auth_repair]
      specialist_auth_repair_failed: [auth_repair.receipt_ref, auth_repair.receipt_valid, reason, evidence_refs]
      auth_repair_receipt_invalid: [auth_repair.receipt_valid, auth_repair.blocked_reason, evidence_refs]

  prepare_candidate:
    kind: delegated
    owner: rote-specialist
    effect: local-write
    input_required: [evidence.verification]
    events:
      candidate_ready: [candidate.reference, candidate.reusable, candidate.contract]
      not_reusable: [reason, evidence_refs]

  author_release:
    kind: delegated
    owner: rote-specialist
    effect: local-write
    input_required: [candidate.reference, consent.save]
    events:
      flow_released: [candidate.released_flow, play.version, verification_refs]

  capture_play_birth:
    kind: deterministic
    owner: play
    effect: local-write
    input_required: [candidate.released_flow, execution.workspace]
    command: scripts/bin/play-birth capture --workspace <execution.workspace> --flow <candidate.released_flow> --json
    events:
      birth_captured: [birth.sha256, birth.flow_fingerprint, birth.object_ref, birth.capture_ref]

  ensure_private_org:
    kind: delegated
    owner: rote-specialist
    effect: external-write
    input_required: [consent.save]
    events:
      private_org_ready: [publication.private_org, owner, members]

  publish_private:
    kind: delegated
    owner: rote-specialist
    effect: external-write
    input_required: [candidate.released_flow, publication.private_org, consent.save]
    events:
      play_published: [publication.canonical_reference, visibility, owner, play.version]

  resolve_public_owner:
    kind: delegated
    owner: rote-specialist
    effect: read
    input_required: [consent.save]
    events:
      public_owner_ready: [publication.owner]
      public_owner_choice_required: [owner_choices]

  publish_public:
    kind: delegated
    owner: rote-specialist
    effect: external-write
    input_required: [candidate.released_flow, publication.owner, consent.save]
    command_policy:
      - Preserve the registry-returned public Play page URI and install/bootstrap URI exactly; do not reconstruct either URL from the canonical reference.
    events:
      play_published: [publication.canonical_reference, publication.uri, publication.install_uri, visibility, owner, play.version]

  bind_play_birth:
    kind: deterministic
    owner: play
    effect: local-write
    input_required: [birth.sha256, publication.canonical_reference, play.version]
    command: scripts/bin/play-birth bind <birth.sha256> --reference <publication.canonical_reference>@<play.version> --json
    events:
      birth_bound: [birth.sha256, birth.exact_reference, birth.registry_content_hash, birth.binding_ref]

  index_playcard:
    kind: deterministic
    owner: play
    effect: local-write
    input_required: [publication.canonical_reference, play.version]
    events:
      play_indexed: [publication.canonical_reference, play.version, index_ref]

  inspect_saved_play:
    kind: deterministic
    owner: flow-runtime
    effect: read
    input_required: [publication.canonical_reference, publication.visibility, play.version]
    command: rote play inspect <publication.canonical_reference> --json
    command_policy:
      - Never replace first-class Play inspection with registry flow info.
      - Return the inspected title, description, and registry content hash for the final verified publication readout.
    events:
      saved_play_inspected: [publication.canonical_reference, publication.visibility, publication.title, publication.description, publication.content_hash, play.version, publication.inspect_ref]

  present_saved_play:
    kind: deterministic
    owner: play
    effect: none
    input_required: [publication.canonical_reference, publication.visibility, publication.owner, publication.title, publication.description, publication.uri, publication.install_uri, publication.content_hash, publication.inspect_ref, play.version]
    command: scripts/bin/play-publication --stdin --json
    command_policy:
      - Run only after canonical inspection matches the authorized publication.
      - For public Plays, present a clickable Play page whose label includes the title and description, the install/bootstrap link, exact canonical reference, visibility, owner, and content hash.
      - For public Plays, include separate fenced plain-text blocks ready to paste into X and LinkedIn; the X copy must remain within 280 characters and both must contain the Play page URI.
      - Use only the registry-returned publication.uri and publication.install_uri. Never invent, reconstruct, shorten, or silently omit either URL.
      - For private Plays, present the verified private reference without public URLs or social copy.
      - Presenting copy does not post, share, invite, or perform any external write.
    events:
      saved_play_presented: [publication.presented, publication.share_copy, publication.presentation_ref, presentation.markdown]

failure_event:
  id: action_blocked
  required: [reason, recoverable, owner, evidence_refs]
