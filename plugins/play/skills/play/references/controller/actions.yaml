schema: play.actions/v1

owners: [play, rote-specialist, flow-runtime]
effects: [none, read, local-write, external-write, mixed]
specialist_owners: [rote-using-adapters, rote-shell, rote-browse, rote-workspace]
adapter_specialist_owners: [rote-adapter-create, rote-adapter-config]
route_owners:
  call: rote-using-adapters
  shell: rote-shell
  drive: rote-browse
  combined: rote-workspace

guards:
  - onboarding_is_greeting
  - onboarding_is_play_uri
  - use_is_onboarding_starter
  - awareness_snapshot_ready
  - search_is_complete
