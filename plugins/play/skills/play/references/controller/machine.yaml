schema: play.machine/v1
machine: play
initial: invoke
terminal: [receipt, completed, exited, blocked]

states:
  invoke:
    owner: play
    checkpoint: after
    requires: [request.original]
    entry: {action: classify_play_invocation}
    "on":
      empty_play_invocation: [{target: onboarding_probe, mutate: start_greeting_onboarding}]
      play_uri_invocation: [{target: onboarding_probe, mutate: start_uri_onboarding}]
      outcome_play_invocation: [{target: search, mutate: set_request_contract}]
      play_awareness_invocation: [{target: awareness_collect, mutate: set_awareness_request}]
      settled_task_invocation: [{target: save_judge, mutate: enter_settled_judgment}]
      settled_task_rejected: [{target: blocked, mutate: record_blocker}]
      ordinary_play_invocation: [{target: qualify, mutate: record_ordinary_invocation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_probe:
    owner: play
    checkpoint: both
    requires: [onboarding.intent]
    entry: {action: probe_rote_for_onboarding}
    "on":
      rote_available:
        - {guard: onboarding_is_greeting, target: onboarding_identity, mutate: record_rote_probe}
        - {guard: onboarding_is_play_uri, target: onboarding_identity, mutate: record_rote_probe}
        - {target: blocked, mutate: record_onboarding_intent_mismatch}
      rote_missing:
        - {guard: onboarding_is_greeting, target: onboarding_setup, mutate: record_rote_probe}
        - {guard: onboarding_is_play_uri, target: onboarding_card_fetch, mutate: record_rote_probe}
        - {target: blocked, mutate: record_onboarding_intent_mismatch}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_identity:
    owner: play
    checkpoint: both
    requires: [onboarding.rote_status, onboarding.rote_command]
    entry: {action: inspect_onboarding_identity}
    "on":
      onboarding_identity_ready:
        - {guard: onboarding_is_greeting, target: onboarding_experience, mutate: record_onboarding_identity}
        - {guard: onboarding_is_play_uri, target: use_inspect, mutate: enter_onboarding_uri_use}
        - {target: blocked, mutate: record_onboarding_intent_mismatch}
      onboarding_identity_setup_required: [{target: onboarding_login_offer, mutate: require_onboarding_login}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_login_offer:
    owner: play
    checkpoint: after
    requires: [onboarding.identity_status, onboarding.rote_command, onboarding.login_status]
    prompt: choose_login_provider
    "on":
      onboarding_google_login_selected: [{target: onboarding_login, mutate: select_google_login}]
      onboarding_github_login_selected: [{target: onboarding_login, mutate: select_github_login}]
      onboarding_login_deferred: [{target: completed, mutate: record_onboarding_login_deferred}]

  onboarding_login:
    owner: rote-specialist
    checkpoint: both
    requires: [onboarding.rote_command, onboarding.login_provider, onboarding.login_status]
    entry: {action: handoff_rote_login}
    "on":
      rote_login_completed: [{target: onboarding_identity, mutate: record_onboarding_login}]
      rote_login_paused: [{target: blocked, mutate: record_onboarding_login_pause}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_experience:
    owner: play
    checkpoint: both
    requires: [onboarding.identity_status, onboarding.email]
    entry: {action: inspect_onboarding_experience}
    "on":
      onboarding_first_use: [{target: onboarding_first_present, mutate: record_onboarding_experience}]
      onboarding_returning: [{target: onboarding_welcome, mutate: record_onboarding_experience}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_first_present:
    owner: play
    checkpoint: both
    requires: [onboarding.experience_status, onboarding.email_handle]
    entry: {action: present_first_use_orientation}
    "on":
      onboarding_first_use_presented: [{target: onboarding_first_record, mutate: record_first_use_orientation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_first_record:
    owner: play
    checkpoint: both
    requires: [onboarding.email, onboarding.orientation_status, onboarding.orientation_ref]
    entry: {action: remember_first_use_orientation}
    "on":
      onboarding_first_use_recorded: [{target: onboarding_first_offer, mutate: record_first_use_marker}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_first_offer:
    owner: play
    checkpoint: after
    requires: [onboarding.orientation_status, onboarding.starter_reference]
    prompt: choose_first_use_path
    "on":
      onboarding_starter_selected: [{target: use_inspect, mutate: enter_onboarding_starter_use}]
      onboarding_team_selected: [{target: onboarding_team_handle, mutate: enter_onboarding_team}]
      onboarding_goal_selected: [{target: onboarding_need, mutate: enter_onboarding_goal}]
      onboarding_awareness_selected: [{target: awareness_collect, mutate: enter_onboarding_awareness}]
      onboarding_dismissed: [{target: completed, mutate: record_onboarding_dismissal}]

  onboarding_team_handle:
    owner: play
    checkpoint: after
    prompt: describe_team_handle
    "on":
      team_handle_described: [{target: onboarding_team_create, mutate: record_team_handle}]

  onboarding_team_create:
    owner: rote-specialist
    checkpoint: both
    requires: [team.slug]
    entry: {action: create_team_space}
    "on":
      team_space_ready: [{target: onboarding_team_present, mutate: record_team_space}]
      team_space_failed: [{target: blocked, mutate: record_team_failure}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_team_present:
    owner: play
    checkpoint: after
    requires: [team.slug, team.name, team.status]
    entry: {action: present_team_loop}
    "on":
      team_loop_presented: [{target: team_invite_offer, mutate: record_team_presentation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  team_invite_offer:
    owner: play
    checkpoint: after
    requires: [team.slug, team.status]
    prompt: choose_team_invite
    "on":
      team_invite_selected: [{target: team_invite_email, mutate: record_team_invite_request}]
      team_onboarding_finished: [{target: completed, mutate: finish_team_onboarding}]

  team_invite_email:
    owner: play
    checkpoint: after
    requires: [team.slug]
    prompt: describe_team_invite
    "on":
      team_invite_described: [{target: team_invite_execute, mutate: record_team_invite_email}]

  team_invite_execute:
    owner: rote-specialist
    checkpoint: both
    requires: [team.slug, team.invite_email, team.invite_role]
    entry: {action: invite_team_member}
    "on":
      team_invite_ready: [{target: team_invite_offer, mutate: record_team_invite}]
      team_invite_failed: [{target: blocked, mutate: record_team_failure}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_need:
    owner: play
    checkpoint: after
    prompt: describe_onboarding_need
    "on":
      onboarding_need_described: [{target: invoke, mutate: record_onboarding_need}]

  onboarding_welcome:
    owner: play
    checkpoint: after
    requires: [onboarding.email, onboarding.email_handle]
    prompt: welcome_play_request
    "on":
      welcome_request_described: [{target: invoke, mutate: record_welcome_request}]

  onboarding_setup:
    owner: rote-specialist
    checkpoint: both
    requires: [onboarding.intent, onboarding.rote_status, onboarding.setup_status]
    entry: {action: handoff_rote_setup}
    "on":
      rote_setup_completed: [{target: onboarding_probe, mutate: record_rote_setup}]
      rote_setup_paused: [{target: blocked, mutate: record_rote_setup_pause}]
      setup_specialist_unavailable: [{target: blocked, mutate: record_setup_specialist_unavailable}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_card_fetch:
    owner: play
    checkpoint: both
    requires: [onboarding.play_uri, onboarding.rote_status]
    entry: {action: fetch_onboarding_play_card}
    "on":
      onboarding_play_card_ready: [{target: onboarding_card_present, mutate: record_onboarding_card}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_card_present:
    owner: play
    checkpoint: after
    requires: [onboarding.card]
    entry: {action: present_onboarding_play_card}
    "on":
      onboarding_play_card_presented: [{target: onboarding_card_offer, mutate: record_onboarding_card_presentation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_card_offer:
    owner: play
    checkpoint: after
    requires: [onboarding.play_uri, onboarding.card_presented]
    prompt: choose_uri_setup
    "on":
      onboarding_uri_setup_selected: [{target: onboarding_setup, mutate: enter_uri_setup}]
      onboarding_card_dismissed: [{target: completed, mutate: record_onboarding_card_dismissal}]

  qualify:
    owner: play
    checkpoint: after
    entry: {action: qualify_request}
    "on":
      outcome_request: [{target: search, mutate: set_request_contract}]
      exact_play_request: [{target: use_inspect, mutate: enter_direct_use}]
      play_search_request: [{target: search, mutate: set_search_request}]
      play_awareness_request: [{target: awareness_collect, mutate: set_awareness_request}]
      play_creation_request: [{target: creator_search, mutate: set_creator_request}]
      play_management_request: [{target: management_list, mutate: set_management_request}]
      play_management_choice_required: [{target: management_offer, mutate: record_management_choices}]
      play_birth_request: [{target: birth_show, mutate: set_birth_request}]
      conversation: [{target: exited, mutate: record_non_outcome_exit}]
      play_excluded: [{target: standby_exit, mutate: record_explicit_exit}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  awareness_collect:
    owner: play
    checkpoint: both
    requires: [awareness.window_days]
    entry: {action: collect_awareness_digest}
    "on":
      awareness_ready: [{target: awareness_present, mutate: record_awareness_digest}]
      awareness_unchanged: [{target: awareness_present, mutate: record_awareness_digest}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  awareness_present:
    owner: play
    checkpoint: after
    requires: [awareness.digest_ref]
    entry: {action: present_awareness_digest}
    "on":
      awareness_presented: [{target: awareness_offer, mutate: record_awareness_presentation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  awareness_offer:
    owner: play
    checkpoint: after
    requires: [awareness.play_choices]
    prompt: select_awareness_play
    "on":
      awareness_play_selected: [{target: use_inspect, mutate: enter_awareness_use}]
      awareness_search_selected: [{target: awareness_need, mutate: record_awareness_search_choice}]
      awareness_create_selected: [{target: creator_need, mutate: record_awareness_create_choice}]
      awareness_dismissed: [{target: completed, mutate: record_awareness_dismissal}]

  awareness_need:
    owner: play
    checkpoint: after
    prompt: describe_awareness_need
    "on":
      awareness_need_described: [{target: search, mutate: set_awareness_search}]

  creator_need:
    owner: play
    checkpoint: after
    prompt: describe_creator_need
    "on":
      creator_need_described: [{target: creator_search, mutate: set_creator_need}]

  creator_search:
    owner: play
    checkpoint: both
    requires: [request.intent, request.requested_outcome, modality_policy]
    entry: {action: search_creator_plays}
    "on":
      creator_search_ready:
        - {guard: search_is_complete, target: creator_classify, mutate: record_creator_search}
        - {target: blocked, mutate: record_incomplete_search}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  creator_classify:
    owner: play
    checkpoint: after
    requires: [search.complete, search.result_refs]
    entry: {action: classify_creator_options}
    "on":
      creator_match_ready: [{target: creator_offer, mutate: record_creator_match}]
      creator_no_match: [{target: standby_exit, mutate: record_creator_standby}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  creator_offer:
    owner: play
    checkpoint: after
    prompt: choose_creator_path
    "on":
      creator_use_selected: [{target: use_inspect, mutate: enter_creator_use}]
      creator_adapt_selected: [{target: standby_exit, mutate: record_creator_standby}]
      creator_create_selected: [{target: standby_exit, mutate: record_creator_standby}]

  management_offer:
    owner: play
    checkpoint: after
    prompt: select_management_views
    "on":
      management_views_selected: [{target: management_list, mutate: choose_management_views}]

  management_list:
    owner: rote-specialist
    checkpoint: both
    requires: [management.views]
    entry: {action: list_play_management}
    "on":
      management_inventory_ready: [{target: management_present, mutate: record_management_inventory}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  management_present:
    owner: play
    checkpoint: after
    requires: [management.views]
    entry: {action: present_play_management}
    "on":
      management_presented: [{target: completed, mutate: record_management_presentation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  birth_show:
    owner: play
    checkpoint: both
    requires: [birth.selector]
    entry: {action: show_play_birth}
    "on":
      birth_ready: [{target: completed, mutate: record_birth_presentation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  search:
    owner: play
    checkpoint: both
    requires: [request.intent, modality_policy]
    entry: {action: search_authorized_plays}
    "on":
      search_ready:
        - {guard: search_only_requested, target: search_present, mutate: record_search_results}
        - {guard: search_is_complete, target: classify, mutate: record_search_results}
        - {target: blocked, mutate: record_incomplete_search}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  search_present:
    owner: play
    checkpoint: after
    requires: [search.complete, search.results]
    entry: {action: present_search_results}
    "on":
      search_presented: [{target: search_offer, mutate: record_search_presentation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  search_offer:
    owner: play
    checkpoint: after
    prompt: choose_search_result
    "on":
      search_play_selected: [{target: use_inspect, mutate: enter_search_use}]
      search_dismissed: [{target: completed, mutate: record_search_dismissal}]

  classify:
    owner: play
    checkpoint: both
    requires: [search.complete, search.results]
    entry: {action: classify_adequacy}
    "on":
      full_match:
        - {guard: match_satisfies_constraints, target: use_inspect, mutate: enter_use}
        - {target: standby_exit, mutate: downgrade_inadequate_match}
      remote_match_choice_required: [{target: search_present, mutate: record_search_results}]
      partial_match: [{target: standby_exit, mutate: record_partial_match}]
      uncertain_match: [{target: standby_exit, mutate: record_uncertain_match}]
      no_match: [{target: standby_exit, mutate: record_no_match}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  use_inspect:
    owner: play
    checkpoint: both
    requires: [match.reference]
    entry: {action: inspect_registry_play}
    "on":
      play_inspected: [{target: use_decide, mutate: record_play_inspection}]
      play_not_runnable:
        - {guard: search_has_remaining_choices, target: search_present, mutate: record_unrunnable_inspection}
        - {target: standby_exit, mutate: record_unrunnable_inspection}
      play_reference_unresolved: [{target: search, mutate: recover_unresolved_reference}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  use_decide:
    owner: play
    checkpoint: both
    requires: [inspection.complete, inspection.local_change, inspection.exact_reference, inspection.disclosure_sha256]
    entry: {action: route_inspected_play}
    "on":
      play_parameter_required: [{target: use_parameter_offer, mutate: record_parameter_request}]
      local_play_ready: [{target: use_prepare, mutate: approve_inspected_run}]
      remote_pull_required: [{target: use_offer, mutate: record_play_inspection}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  use_parameter_offer:
    owner: play
    checkpoint: after
    requires: [parameter_input.name, parameter_input.label, parameter_input.type]
    prompt: supply_play_parameter
    "on":
      play_parameter_supplied: [{target: use_decide, mutate: record_parameter_value}]

  use_offer:
    owner: play
    checkpoint: after
    requires: [inspection.complete, inspection.exact_reference, inspection.disclosure_sha256]
    prompt: approve_play_run
    "on":
      play_run_approved: [{target: use_prepare, mutate: approve_inspected_run}]
      play_run_declined: [{target: completed, mutate: record_run_dismissal}]

  use_prepare:
    owner: play
    checkpoint: after
    requires: [inspection.exact_reference, inspection.disclosure_sha256]
    entry: {action: prepare_play_run_handoff}
    "on":
      play_run_handoff_ready: [{target: use_run, mutate: record_play_run_handoff}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  use_run:
    owner: play
    checkpoint: both
    requires: [match.reference, inspection.exact_reference, inspection.disclosure_sha256]
    entry: {action: run_registry_play}
    "on":
      play_run_ready: [{target: use_verify, mutate: record_controller_run}]
      play_drifted: [{target: standby_exit, mutate: record_failed_receipt}]
      play_authentication_required: [{target: use_authentication_offer, mutate: record_use_authentication_required}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  use_authentication_offer:
    owner: play
    checkpoint: after
    requires: [inspection.operations, authentication.source, authentication.status, authentication.recoverable, authentication.adapter_id, authentication.env_var, authentication.classified_rung, authentication.evidence_refs, authentication.original_packet, authentication.original_packet_sha256]
    prompt: approve_authentication
    "on":
      authentication_approved: [{target: use_authentication_execute, mutate: approve_authentication}]
      authentication_declined: [{target: blocked, mutate: decline_authentication}]

  use_authentication_execute:
    owner: rote-specialist
    checkpoint: both
    requires: [inspection.operations, authentication.source, authentication.status, authentication.owner, authentication.recoverable, authentication.adapter_id, authentication.env_var, authentication.classified_rung, authentication.distinguishing_error, authentication.evidence_refs, authentication.original_packet, authentication.original_packet_sha256]
    entry: {action: execute_authentication}
    "on":
      authentication_ready: [{target: use_inspect, mutate: record_authentication_success}]
      authentication_failed: [{target: blocked, mutate: record_authentication_failure}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  use_verify:
    owner: play
    checkpoint: after
    entry: {action: verify_play_output}
    "on":
      outcome_verified: [{target: use_receipt, mutate: record_verification}]
      play_drifted: [{target: standby_exit, mutate: record_failed_receipt}]
      outcome_not_verified: [{target: standby_exit, mutate: record_failed_receipt}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  use_receipt:
    owner: play
    checkpoint: after
    entry: {action: build_receipt}
    "on":
      receipt_ready:
        - {guard: use_is_onboarding_starter, target: onboarding_result_offer, mutate: attach_onboarding_starter_receipt}
        - {target: receipt, mutate: attach_receipt}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_result_offer:
    owner: play
    checkpoint: after
    requires: [receipt_ref, output.primary]
    prompt: confirm_onboarding_result
    "on":
      onboarding_result_confirmed: [{target: onboarding_activation_present, mutate: record_onboarding_result_confirmation}]
      onboarding_result_replay_requested: [{target: onboarding_result_replay, mutate: request_onboarding_result_replay}]
      onboarding_result_finished: [{target: receipt, mutate: finish_onboarding_activation}]

  onboarding_result_replay:
    owner: play
    checkpoint: both
    requires: [receipt_ref, output.primary]
    entry: {action: replay_onboarding_result}
    "on":
      onboarding_result_replayed: [{target: onboarding_result_offer, mutate: record_onboarding_result_replay}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_activation_present:
    owner: play
    checkpoint: both
    requires: [onboarding.starter_status, receipt_ref]
    entry: {action: present_first_play_activation}
    "on":
      onboarding_activation_presented: [{target: onboarding_activation_offer, mutate: record_onboarding_activation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  onboarding_activation_offer:
    owner: play
    checkpoint: after
    requires: [onboarding.activation_status, receipt_ref]
    prompt: choose_onboarding_next
    "on":
      onboarding_team_selected: [{target: onboarding_team_handle, mutate: enter_onboarding_team}]
      onboarding_goal_selected: [{target: onboarding_need, mutate: enter_onboarding_goal}]
      onboarding_awareness_selected:
        - {guard: awareness_snapshot_ready, target: awareness_offer, mutate: record_awareness_presentation}
        - {target: awareness_collect, mutate: enter_onboarding_awareness}
      onboarding_finished: [{target: receipt, mutate: finish_onboarding_activation}]

  standby_exit:
    owner: play
    checkpoint: both
    requires: [request.original]
    entry: {action: record_standby}
    "on":
      standby_recorded: [{target: exited, mutate: record_save_hook}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  save_judge:
    owner: play
    checkpoint: after
    requires: [request.original]
    entry: {action: judge_save_worthiness}
    "on":
      worth_saving: [{target: crystallize, mutate: record_save_worthiness}]
      not_worth_saving: [{target: exited, mutate: record_not_worth_saving}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  crystallize:
    owner: rote-specialist
    checkpoint: both
    requires: [capture.reference, capture.workspace, capture.trajectory_ref, evidence.verification]
    entry: {action: prepare_candidate}
    "on":
      candidate_ready:
        - {guard: captured_trajectory_is_verified, target: save_prepare, mutate: record_candidate}
        - {target: blocked, mutate: record_verification_failure}
      not_reusable: [{target: completed, mutate: record_unpublished_result}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  save_prepare:
    owner: play
    checkpoint: both
    requires: [candidate.reference]
    entry: {action: resolve_public_owner}
    "on":
      public_owner_context_ready: [{target: save_offer, mutate: record_public_owner_context}]
      public_owner_context_unavailable: [{target: save_offer, mutate: record_public_owner_unavailable}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  save_offer:
    owner: play
    checkpoint: after
    requires: [publication.owner_resolution, publication.owner_choices, publication.owner_summary]
    prompt: private_public_or_skip
    "on":
      save_private: [{target: author_release, mutate: choose_private}]
      save_public:
        - {guard: public_owner_is_resolved, target: author_release, mutate: choose_resolved_public_owner}
        - {guard: public_owner_choice_is_required, target: public_owner_offer, mutate: choose_public}
        - {target: blocked, mutate: record_owner_blocker}
      save_skipped: [{target: completed, mutate: record_save_skipped}]

  public_owner_offer:
    owner: play
    checkpoint: after
    requires: [publication.owner_resolution, publication.owner_choices, publication.owner_summary]
    prompt: select_public_owner
    "on":
      public_owner_selected: [{target: author_release, mutate: record_public_owner}]
      public_owner_declined: [{target: blocked, mutate: record_owner_blocker}]

  author_release:
    owner: rote-specialist
    checkpoint: both
    requires: [candidate.reference, consent.save]
    entry: {action: author_release}
    "on":
      flow_released:
        - {guard: released_candidate_is_unpublished, target: birth_capture, mutate: record_release}
        - {target: blocked, mutate: record_publication_boundary_violation}
      publication_boundary_violated: [{target: blocked, mutate: record_publication_boundary_violation}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  birth_capture:
    owner: play
    checkpoint: both
    requires: [candidate.released_flow, execution.workspace]
    entry: {action: capture_play_birth}
    "on":
      birth_captured:
        - {guard: save_choice_private, target: private_org, mutate: record_birth_capture}
        - {guard: save_choice_public, target: public_publish, mutate: record_birth_capture}
        - {target: blocked, mutate: record_missing_save_choice}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  private_org:
    owner: rote-specialist
    checkpoint: both
    entry: {action: ensure_private_org}
    "on":
      private_org_ready:
        - {guard: private_org_policy_satisfied, target: private_publish, mutate: record_private_org}
        - {target: blocked, mutate: record_private_org_violation}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  private_publish:
    owner: rote-specialist
    checkpoint: both
    entry: {action: publish_private}
    "on":
      play_published:
        - {guard: private_publication_matches_captured_birth, target: birth_bind, mutate: record_publication}
        - {target: blocked, mutate: record_publication_boundary_violation}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  public_publish:
    owner: rote-specialist
    checkpoint: both
    entry: {action: publish_public}
    "on":
      play_published:
        - {guard: public_publication_matches_captured_birth, target: birth_bind, mutate: record_publication}
        - {target: blocked, mutate: record_publication_boundary_violation}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  birth_bind:
    owner: play
    checkpoint: both
    requires: [birth.sha256, publication.canonical_reference, play.version]
    entry: {action: bind_play_birth}
    "on":
      birth_bound: [{target: index, mutate: record_birth_binding}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  index:
    owner: rote-specialist
    checkpoint: both
    requires: [publication.canonical_reference]
    entry: {action: index_playcard}
    "on":
      play_indexed:
        - {guard: exact_published_version_is_indexed, target: saved_inspect, mutate: record_index}
        - {target: blocked, mutate: record_index_mismatch}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  saved_inspect:
    owner: play
    checkpoint: both
    requires: [publication.canonical_reference, publication.visibility, play.version]
    entry: {action: inspect_saved_play}
    "on":
      saved_play_inspected:
        - {guard: saved_public_inspection_matches_publication, target: publication_credentials, mutate: record_saved_inspection}
        - {guard: saved_inspection_matches_publication, target: birth_present, mutate: record_saved_inspection}
        - {target: blocked, mutate: record_saved_inspection_mismatch}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  publication_credentials:
    owner: flow-runtime
    checkpoint: both
    requires: [publication.canonical_reference, publication.uri, publication.visibility, play.version]
    entry: {action: inspect_publication_credentials}
    "on":
      associated_credentials_verified: [{target: publication_smoke, mutate: record_credential_contracts}]
      associated_credentials_invalid: [{target: blocked, mutate: record_credential_contract_failure}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  publication_smoke:
    owner: flow-runtime
    checkpoint: both
    requires: [publication.uri, publication.visibility, play.version, request.parameters, consent.save, publication_validation.credential_status, publication_validation.credential_contract_sha256]
    entry: {action: smoke_publication}
    "on":
      public_smoke_verified: [{target: birth_present, mutate: record_public_smoke}]
      public_smoke_failed: [{target: blocked, mutate: record_public_smoke_failure}]
      action_blocked: [{target: blocked, mutate: record_blocker}]

  birth_present:
    owner: play
    checkpoint: both
    requires: [birth.sha256, birth.flow_fingerprint, birth.exact_reference, birth.registry_content_hash, birth.binding_ref, publication.canonical_reference, publication.visibility, publication.owner, publication.title, publication.description, publication.uri, publication.install_uri, publication.content_hash, publication.inspect_ref, publication_validation.credential_status, publication_validation.smoke_status, play.version, exploration.human_name, onboarding.email_handle]
    entry: {action: present_birth_certificate}
    "on":
      birth_certificate_presented:
        - {guard: save_choice_private, target: team_invite_offer, mutate: record_birth_certificate_presentation}
        - {target: completed, mutate: record_birth_certificate_presentation}
      action_blocked: [{target: blocked, mutate: record_blocker}]

  receipt: {owner: play}
  completed: {owner: play}
  exited: {owner: play}
  blocked: {owner: play}
