schema: play.model-config/v1

# Used only when the attached Rote workspace has no confirmed model identity.
model:
  provider: openai
  name: codex
  family: codex
  effort: medium
  pricing_model: gpt-5-codex

selection:
  prefer_workspace_model: true

# Context occupancy cannot be reconstructed exactly from tool traffic alone.
# Journey uses the catalog input limit and this threshold to render a clearly
# marked estimate. Set window_tokens for a harness-specific override.
context:
  compaction_threshold: 0.90
  window_tokens: null

# Add an exact provider/model key here when a workspace needs richer identity.
# The workspace still owns the observed provider and model; these entries only
# supply family, effort, catalog alias, or context limits Rote does not store.
# Example:
#   openai/gpt-5:
#     effort: high
#     context_window_tokens: 1000000
#     compaction_threshold: 0.90
overrides: {}

catalog:
  source: https://raw.githubusercontent.com/BerriAI/litellm/refs/heads/main/model_prices_and_context_window.json
  cache: cache/model_prices_and_context_window.json
