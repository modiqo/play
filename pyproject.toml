[project]
name = "modiqo-play-controller"
version = "0.4.109"
description = "Play: a rote journey pack, recurring Plays, and journey tooling"
requires-python = ">=3.10"
dependencies = [
    "ast-grep-py>=0.39,<1",
    "jsonschema>=4.23,<5",
    "PyYAML>=6,<7",
]

[dependency-groups]
dev = ["pyright>=1.1.403,<2"]

[tool.uv]
package = false

[tool.pyright]
include = ["scripts/lib/play", "tests"]
extraPaths = ["scripts/lib", ".github/release"]
venvPath = "."
venv = ".venv"

[tool.typos.default.extend-words]
metalness = "metalness"
